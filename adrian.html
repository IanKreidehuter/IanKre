<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Japanese Quiz</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #f4f4f4;
  color: #171717;
}

.page {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.card {
  width: 100%;
  max-width: 560px;
  background: white;
  border-radius: 22px;
  padding: 28px;
  box-shadow: 0 10px 40px rgba(0,0,0,.08);
}

.hidden {
  display: none !important;
}

.fade-in {
  animation: fadeIn .4s ease;
}

.fade-out {
  animation: fadeOut .35s ease forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeOut {
  from {
    opacity: 1;
  }

  to {
    opacity: 0;
  }
}

h1 {
  text-align: center;
  margin-top: 0;
}

.subtitle {
  text-align: center;
  color: #777;
}

input {
  width: 100%;
  padding: 15px;
  border: 1px solid #ccc;
  border-radius: 12px;
  font-size: 16px;
  margin-top: 20px;
}

button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  margin-top: 15px;
  background: #171717;
  color: white;
  font-size: 16px;
}

button:disabled {
  opacity: .5;
}

.progress {
  display: flex;
  justify-content: space-between;
  color: #777;
  font-size: 14px;
}

.kanji {
  text-align: center;
  font-size: 64px;
  margin: 35px 0;
}

.instruction {
  text-align: center;
  color: #777;
  margin-bottom: 18px;
}

.options {
  display: grid;
  gap: 12px;
}

.option {
  padding: 17px;
  border: 2px solid #ddd;
  border-radius: 14px;
  cursor: pointer;
}

.option.selected {
  border-color: #171717;
  background: #f0f0f0;
}

.option.correct {
  border-color: #222;
  background: #e8f5e9;
}

.option.wrong {
  border-color: #777;
  background: #f5f5f5;
}

.result {
  text-align: center;
  font-size: 24px;
  font-weight: bold;
  margin: 20px 0;
}

.stats {
  text-align: center;
  margin: 25px 0;
}

.stat {
  margin: 12px 0;
  font-size: 18px;
}

.review-item {
  border: 1px solid #ddd;
  border-radius: 14px;
  padding: 16px;
  margin-top: 12px;
}

.review-kanji {
  font-size: 28px;
  font-weight: bold;
}

.review-status {
  margin-top: 8px;
  font-weight: bold;
}

.small {
  text-align: center;
  color: #777;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- =========================
     NAMA
========================= -->

<section id="namePage" class="page">

  <div class="card">

    <h1>Japanese Quiz</h1>

    <p class="subtitle">
      Masukkan nama untuk memulai
    </p>

    <input
      id="nameInput"
      type="text"
      placeholder="Nama kamu"
    >

    <button id="startButton">
      MULAI
    </button>

    <p id="nameError" class="small"></p>

  </div>

</section>


<!-- =========================
     QUIZ
========================= -->

<section id="quizPage" class="page hidden">

  <div class="card">

    <div class="progress">

      <span id="progressText">
        Pertanyaan
      </span>

      <span id="scoreText">
        0/2
      </span>

    </div>

    <div id="kanji" class="kanji"></div>

    <div class="instruction">
      Pilih maksimal 2 jawaban
    </div>

    <div id="options" class="options"></div>

    <button id="answerButton" disabled>
      JAWAB
    </button>

    <div id="result" class="result"></div>

  </div>

</section>


<!-- =========================
     HASIL
========================= -->

<section id="resultPage" class="page hidden">

  <div class="card">

    <h1>Quiz Selesai</h1>

    <p id="resultName" class="subtitle"></p>

    <div class="stats">

      <div class="stat">
        <strong id="totalResult">0</strong>
        Pertanyaan
      </div>

      <div class="stat">
        ✓ <strong id="correctResult">0</strong>
        Benar
      </div>

      <div class="stat">
        ✓ <strong id="partialResult">0</strong>
        Sebagian benar
      </div>

      <div class="stat">
        × <strong id="wrongResult">0</strong>
        Salah
      </div>

    </div>

    <p id="saveStatus" class="small">
      Menyimpan hasil...
    </p>

    <button id="reviewButton">
      LIHAT REVIEW
    </button>

  </div>

</section>


<!-- =========================
     REVIEW
========================= -->

<section id="reviewPage" class="page hidden">

  <div class="card">

    <h1>Review</h1>

    <div id="reviewList"></div>

    <button id="backResultButton">
      KEMBALI KE HASIL
    </button>

  </div>

</section>


<script>

/* =========================================
   API
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzwwzXuR4RyVsYotVtvrj8azxZyfmNyIwxngTkH6SEAJl7P8_Y4HKKHRFuPLT4JMSWCTQ/exec";


/* =========================================
   DATA
========================================= */

let playerName = "";

let questions = [];

let currentIndex = 0;

let selectedOptions = [];

let currentQuestion = null;

let results = [];


/* =========================================
   ELEMENTS
========================================= */

const namePage =
document.getElementById("namePage");

const quizPage =
document.getElementById("quizPage");

const resultPage =
document.getElementById("resultPage");

const reviewPage =
document.getElementById("reviewPage");

const nameInput =
document.getElementById("nameInput");

const startButton =
document.getElementById("startButton");

const nameError =
document.getElementById("nameError");

const progressText =
document.getElementById("progressText");

const scoreText =
document.getElementById("scoreText");

const kanji =
document.getElementById("kanji");

const options =
document.getElementById("options");

const answerButton =
document.getElementById("answerButton");

const result =
document.getElementById("result");

const resultName =
document.getElementById("resultName");

const totalResult =
document.getElementById("totalResult");

const correctResult =
document.getElementById("correctResult");

const partialResult =
document.getElementById("partialResult");

const wrongResult =
document.getElementById("wrongResult");

const saveStatus =
document.getElementById("saveStatus");

const reviewList =
document.getElementById("reviewList");

const reviewButton =
document.getElementById("reviewButton");

const backResultButton =
document.getElementById("backResultButton");


/* =========================================
   START
========================================= */

startButton.addEventListener(
  "click",
  startQuiz
);


async function startQuiz() {

  playerName =
    nameInput.value.trim();

  if (!playerName) {

    nameError.textContent =
      "Masukkan nama terlebih dahulu.";

    return;
  }

  nameError.textContent = "";

  startButton.disabled = true;

  startButton.textContent =
    "MEMUAT...";

  try {

    const response =
      await fetch(API_URL);

    const data =
      await response.json();

    if (!data.success) {

      throw new Error(
        data.error ||
        "Gagal mengambil soal."
      );
    }

    questions =
      data.questions || [];

    if (!questions.length) {

      throw new Error(
        "Questions kosong."
      );
    }

    currentIndex = 0;

    results = [];

    namePage.classList.add(
      "fade-out"
    );

    setTimeout(() => {

      namePage.classList.add(
        "hidden"
      );

      quizPage.classList.remove(
        "hidden"
      );

      quizPage.classList.add(
        "fade-in"
      );

      showQuestion();

    }, 350);

  } catch (error) {

    console.error(error);

    nameError.textContent =
      "Gagal mengambil soal: " +
      error.message;

    startButton.disabled = false;

    startButton.textContent =
      "MULAI";
  }
}


/* =========================================
   QUESTION
========================================= */

function showQuestion() {

  currentQuestion =
    questions[currentIndex];

  selectedOptions = [];

  result.textContent = "";

  answerButton.disabled = true;

  progressText.textContent =
    "Pertanyaan " +
    (currentIndex + 1) +
    " / " +
    questions.length;

  scoreText.textContent =
    "0/2";

  kanji.textContent =
    currentQuestion.kanji;

  createOptions();
}


/* =========================================
   OPTIONS
========================================= */

function createOptions() {

  options.innerHTML = "";

  const otherQuestions =
    questions.filter(
      q => q.id !== currentQuestion.id
    );

  shuffle(otherQuestions);


  const wrongHiragana =
    otherQuestions[0]
      ? otherQuestions[0].hiragana
      : "よむ";

  const wrongIndonesia =
    otherQuestions[1]
      ? otherQuestions[1].indonesia
      : "membaca";


  const list = [

    {
      type: "hiragana",
      value: currentQuestion.hiragana,
      correct: true
    },

    {
      type: "indonesia",
      value: currentQuestion.indonesia,
      correct: true
    },

    {
      type: "hiragana",
      value: wrongHiragana,
      correct: false
    },

    {
      type: "indonesia",
      value: wrongIndonesia,
      correct: false
    }

  ];


  shuffle(list);


  list.forEach(
    (item, index) => {

      const element =
        document.createElement("div");

      element.className =
        "option";

      element.dataset.index =
        index;

      element.dataset.correct =
        item.correct;

      element.dataset.type =
        item.type;

      element.textContent =
        String.fromCharCode(65 + index) +
        ". " +
        item.value;

      element.addEventListener(
        "click",
        () => toggleOption(
          element
        )
      );

      options.appendChild(
        element
      );
    }
  );
}


/* =========================================
   SELECT
========================================= */

function toggleOption(element) {

  const index =
    Number(element.dataset.index);

  if (
    selectedOptions.includes(index)
  ) {

    selectedOptions =
      selectedOptions.filter(
        x => x !== index
      );

    element.classList.remove(
      "selected"
    );

  } else {

    if (
      selectedOptions.length >= 2
    ) {
      return;
    }

    selectedOptions.push(index);

    element.classList.add(
      "selected"
    );
  }

  scoreText.textContent =
    selectedOptions.length +
    "/2";

  answerButton.disabled =
    selectedOptions.length === 0;
}


/* =========================================
   CHECK
========================================= */

answerButton.addEventListener(
  "click",
  checkAnswer
);


function checkAnswer() {

  const elements =
    document.querySelectorAll(
      ".option"
    );

  let correctCount = 0;

  const selectedData = [];


  selectedOptions.forEach(
    index => {

      const element =
        elements[index];

      const isCorrect =
        element.dataset.correct ===
        "true";

      if (isCorrect) {
        correctCount++;
      }

      selectedData.push({
        answer:
          element.textContent,
        correct:
          isCorrect
      });
    }
  );


  let category = "";


  if (correctCount === 2) {

    category = "benar";

    result.textContent =
      "2/2 BENAR";

  } else if (
    correctCount === 1
  ) {

    category = "sebagian";

    result.textContent =
      "1/2 BENAR";

  } else {

    category = "salah";

    result.textContent =
      "0/2 SALAH";
  }


  results.push({

    id:
      currentQuestion.id,

    kanji:
      currentQuestion.kanji,

    hiragana:
      currentQuestion.hiragana,

    indonesia:
      currentQuestion.indonesia,

    score:
      correctCount,

    category:
      category,

    selected:
      selectedData

  });


  elements.forEach(
    element => {

      const isCorrect =
        element.dataset.correct ===
        "true";

      if (isCorrect) {

        element.classList.add(
          "correct"
        );

      } else if (
        selectedOptions.includes(
          Number(element.dataset.index)
        )
      ) {

        element.classList.add(
          "wrong"
        );
      }

      element.style.pointerEvents =
        "none";
    }
  );


  answerButton.disabled =
    true;


  setTimeout(
    nextQuestion,
    900
  );
}


/* =========================================
   NEXT
========================================= */

function nextQuestion() {

  currentIndex++;


  if (
    currentIndex >=
    questions.length
  ) {

    finishQuiz();

    return;
  }


  showQuestion();
}


/* =========================================
   FINISH
========================================= */

async function finishQuiz() {

  quizPage.classList.add(
    "fade-out"
  );


  setTimeout(async () => {

    quizPage.classList.add(
      "hidden"
    );

    resultPage.classList.remove(
      "hidden"
    );

    resultPage.classList.add(
      "fade-in"
    );


    const total =
      results.length;

    const correct =
      results.filter(
        r => r.category === "benar"
      ).length;

    const partial =
      results.filter(
        r => r.category === "sebagian"
      ).length;

    const wrong =
      results.filter(
        r => r.category === "salah"
      ).length;


    resultName.textContent =
      playerName;

    totalResult.textContent =
      total;

    correctResult.textContent =
      correct;

    partialResult.textContent =
      partial;

    wrongResult.textContent =
      wrong;


    await sendResults(
      total,
      correct,
      partial,
      wrong
    );

  }, 350);
}


/* =========================================
   SEND TO GOOGLE SHEETS
========================================= */

async function sendResults(
  total,
  correct,
  partial,
  wrong
) {

  saveStatus.textContent =
    "Mengirim hasil ke admin...";


  const payload = {

    nama:
      playerName,

    total:
      total,

    benar:
      correct,

    sebagian:
      partial,

    salah:
      wrong,

    detail:
      results
  };


  try {

    await fetch(
      API_URL,
      {
        method: "POST",

        mode: "no-cors",

        headers: {
          "Content-Type":
            "text/plain;charset=utf-8"
        },

        body:
          JSON.stringify(payload)
      }
    );


    saveStatus.textContent =
      "Hasil sudah dikirim ke admin.";

  } catch (error) {

    console.error(error);

    saveStatus.textContent =
      "Gagal mengirim hasil.";
  }
}


/* =========================================
   REVIEW
========================================= */

reviewButton.addEventListener(
  "click",
  showReview
);


function showReview() {

  resultPage.classList.add(
    "hidden"
  );

  reviewPage.classList.remove(
    "hidden"
  );

  reviewPage.classList.add(
    "fade-in"
  );

  reviewList.innerHTML = "";


  results.forEach(
    item => {

      const div =
        document.createElement("div");

      div.className =
        "review-item";


      let symbol = "×";

      if (
        item.category === "benar"
      ) {

        symbol = "✓";

      } else if (
        item.category === "sebagian"
      ) {

        symbol = "△";
      }


      const answers =
        item.selected
          .map(
            x =>
              escapeHTML(
                x.answer
              )
          )
          .join("<br>");


      div.innerHTML = `

        <div class="review-kanji">
          ${escapeHTML(item.kanji)}
        </div>

        <div>
          ${escapeHTML(item.hiragana)}
          — 
          ${escapeHTML(item.indonesia)}
        </div>

        <div class="review-status">
          ${symbol} ${item.score}/2
        </div>

        <div class="small">
          Jawaban kamu:
          <br>
          ${answers || "Tidak ada"}
        </div>

      `;


      reviewList.appendChild(
        div
      );
    }
  );
}


/* =========================================
   BACK
========================================= */

backResultButton.addEventListener(
  "click",
  () => {

    reviewPage.classList.add(
      "hidden"
    );

    resultPage.classList.remove(
      "hidden"
    );
  }
);


/* =========================================
   SHUFFLE
========================================= */

function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(
        Math.random() *
        (i + 1)
      );

    [
      array[i],
      array[j]
    ] =
    [
      array[j],
      array[i]
    ];
  }

  return array;
}


/* =========================================
   HTML SAFETY
========================================= */

function escapeHTML(value) {

  return String(value)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}

</script>

</body>
</html>
