<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Japanese Quiz Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .quiz {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    .kanji {
      font-size: 60px;
      text-align: center;
      margin: 30px 0;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .option {
      display: block;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      cursor: pointer;
    }

    .option input {
      margin-right: 10px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    #hasil {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="quiz">

    <h1>Japanese Quiz</h1>

    <input
      type="text"
      id="nama"
      placeholder="Masukkan nama"
    >

    <div class="kanji">食べる</div>

    <label class="option">
      <input type="radio" name="jawaban" value="たべる">
      A. たべる
    </label>

    <label class="option">
      <input type="radio" name="jawaban" value="のむ">
      B. のむ
    </label>

    <label class="option">
      <input type="radio" name="jawaban" value="みる">
      C. みる
    </label>

    <label class="option">
      <input type="radio" name="jawaban" value="きく">
      D. きく
    </label>

    <button onclick="kirimJawaban()">
      KIRIM JAWABAN
    </button>

    <div id="hasil"></div>

  </div>

  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyzpiEaqOtcoBqxmP81jp08_ZafyjNaCzB59SZ2YF1g8yN-1xh98VWWbQS5gYh2ore0/exec";

    async function kirimJawaban() {

      const nama =
        document.getElementById("nama").value.trim();

      const pilihan =
        document.querySelector(
          'input[name="jawaban"]:checked'
        );

      const hasil =
        document.getElementById("hasil");

      if (!nama) {
        hasil.textContent = "Masukkan nama dulu.";
        return;
      }

      if (!pilihan) {
        hasil.textContent = "Pilih jawaban dulu.";
        return;
      }

      const jawaban = pilihan.value;

      const skor =
        jawaban === "たべる" ? 1 : 0;

      hasil.textContent = "Mengirim hasil...";

      try {

        await fetch(API_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=utf-8"
          },
          body: JSON.stringify({
            nama: nama,
            kanji: "食べる",
            jawaban: jawaban,
            skor: skor
          })
        });

        if (skor === 1) {
          hasil.textContent =
            "Benar! Hasil sudah dikirim.";
        } else {
          hasil.textContent =
            "Salah. Hasil sudah dikirim.";
        }

      } catch (error) {

        console.error(error);

        hasil.textContent =
          "Gagal mengirim hasil.";

      }
    }

  </script>

</body>
</html>
