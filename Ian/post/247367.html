<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>transmission</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #05080a;
    --fg: #3dff85;
    --fg-dim: #1c6b3c;
    --fg-soft: #8fffb8;
    --glitch-a: #ff2d6e;
    --glitch-b: #00d9ff;
    --scan-op: .07;
  }

  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    overflow:hidden;
    font-family: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }

  body{
    width:100%;
    height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    color: var(--fg);
  }

  /* ambient background glow */
  .glow{
    position:fixed; inset:0;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(61,255,133,.10), transparent 60%),
      radial-gradient(ellipse at 50% 100%, rgba(0,217,255,.05), transparent 55%);
    pointer-events:none;
  }

  /* CRT scanlines */
  .scanlines{
    position:fixed; inset:0;
    pointer-events:none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,var(--scan-op)) 3px,
      rgba(0,0,0,0) 4px
    );
    mix-blend-mode: multiply;
    animation: scan-drift 9s linear infinite;
  }
  @keyframes scan-drift{
    0%{ background-position: 0 0; }
    100%{ background-position: 0 60px; }
  }

  .vignette{
    position:fixed; inset:0; pointer-events:none;
    box-shadow: inset 0 0 12vw rgba(0,0,0,.85);
  }

  .flicker{
    position:fixed; inset:0; pointer-events:none;
    background: rgba(61,255,133,0.02);
    animation: flick 6.5s infinite;
  }
  @keyframes flick{
    0%, 96%, 100% { opacity: 0; }
    97% { opacity: 1; }
    98% { opacity: 0; }
    99% { opacity: .6; }
  }

  /* terminal window */
  .term-wrap{
    position:relative;
    width: min(84vw, 900px);
    height: min(72vh, 640px);
    display:flex;
    flex-direction:column;
    z-index:2;
  }

  .term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding: 0 4px 10px 4px;
    color: var(--fg-dim);
    font-size: clamp(.65rem, 1.4vw, .8rem);
    letter-spacing: .12em;
    text-transform: uppercase;
    flex-shrink:0;
  }
  .term-bar .dots{ display:flex; gap:6px; margin-right:10px; }
  .term-bar .dot{ width:9px; height:9px; border-radius:50%; background: var(--fg-dim); opacity:.5; }
  .term-bar .status{ margin-left:auto; }
  .term-bar .status .rec{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    background: var(--glitch-a); margin-right:6px;
    box-shadow: 0 0 8px var(--glitch-a);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:.3;} 50%{opacity:1;} }

  .term-screen{
    flex:1;
    overflow:hidden;
    border: 1px solid rgba(61,255,133,.18);
    border-radius: 6px;
    background: linear-gradient(180deg, rgba(61,255,133,.035), rgba(0,0,0,0) 40%);
    padding: clamp(16px, 3vh, 30px) clamp(16px, 3.4vw, 30px);
    position: relative;
  }

  .term-inner{
    height:100%;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .term-inner::-webkit-scrollbar{ display:none; }

  .prompt-line{
    color: var(--fg-dim);
    font-size: clamp(.7rem, 1.6vw, .85rem);
    margin-bottom: clamp(10px, 2vh, 18px);
    letter-spacing: .06em;
  }

  .prompt-line.warn{
    color: var(--glitch-a);
  }

  #typed{
    font-size: clamp(1rem, 2.6vw, 1.35rem);
    line-height: 1.65;
    color: var(--fg);
    white-space: pre-wrap;
    word-break: break-word;
    text-shadow: 0 0 6px rgba(61,255,133,.35);
  }

  .cursor{
    display:inline-block;
    width: 0.55em;
    height: 1em;
    background: var(--fg);
    margin-left: 2px;
    vertical-align: text-bottom;
    box-shadow: 0 0 8px var(--fg);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }

  .glitch-char{
    display:inline-block;
    position:relative;
  }

  /* full-terminal glitch burst */
  .term-screen.burst #typed{
    animation: rgbsplit .22s steps(2,end);
  }
  .term-screen.burst{
    animation: jitter .22s steps(2,end);
  }
  @keyframes rgbsplit{
    0%{ text-shadow: -2px 0 var(--glitch-a), 2px 0 var(--glitch-b); }
    30%{ text-shadow: 2px 0 var(--glitch-a), -2px 0 var(--glitch-b); }
    60%{ text-shadow: -1px 0 var(--glitch-a), 1px 0 var(--glitch-b); }
    100%{ text-shadow: 0 0 6px rgba(61,255,133,.35); }
  }
  @keyframes jitter{
    0%{ transform: translate(0,0); }
    25%{ transform: translate(-2px,1px); }
    50%{ transform: translate(2px,-1px); }
    75%{ transform: translate(-1px,0); }
    100%{ transform: translate(0,0); }
  }

  /* start overlay */
  .gate{
    position:fixed; inset:0;
    background: var(--bg);
    display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:22px;
    z-index: 10;
    cursor:pointer;
    transition: opacity .6s ease;
    /* prevents double-tap-to-zoom / long-press callouts from interfering with the tap gesture on mobile */
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .gate.hidden{ opacity:0; pointer-events:none; }
  .gate-label{
    color: var(--fg);
    font-size: clamp(.85rem, 2.4vw, 1.1rem);
    letter-spacing: .3em;
    text-transform: uppercase;
    border: 1px solid var(--fg-dim);
    padding: 14px 28px;
    animation: gpulse 1.8s ease-in-out infinite;
  }
  @keyframes gpulse{
    0%,100%{ box-shadow: 0 0 0 rgba(61,255,133,0); border-color: var(--fg-dim); }
    50%{ box-shadow: 0 0 22px rgba(61,255,133,.35); border-color: var(--fg); }
  }
  .gate-sub{
    color: var(--fg-dim);
    font-size: clamp(.6rem, 1.6vw, .75rem);
    letter-spacing: .2em;
    text-transform: uppercase;
  }

  /* orientation tuning */
  @media (orientation: portrait){
    .term-wrap{ width: 92vw; height: 78dvh; }
    .term-screen{ padding: 18px 16px; }
  }
  @media (orientation: landscape){
    .term-wrap{ width: min(78vw, 980px); height: min(80dvh, 560px); }
  }
  @media (max-height: 420px){
    .term-bar{ padding-bottom:6px; }
    #typed{ font-size: 0.95rem; line-height:1.5; }
  }

  @media (prefers-reduced-motion: reduce){
    .scanlines, .flicker{ animation:none; }
    .term-screen.burst, .term-screen.burst #typed{ animation:none; }
    .cursor{ animation:none; opacity:1; }
  }

  audio{ display:none; }
</style>
</head>
<body>

  <div class="gate" id="gate">
    <div class="gate-label">tap to begin</div>
    <div class="gate-sub">audio · 1:13</div>
  </div>

  <div class="glow"></div>
  <div class="scanlines"></div>
  <div class="flicker"></div>
  <div class="vignette"></div>

  <div class="term-wrap">
    <div class="term-bar">
      <span class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
      <span>session — closed_loop</span>
      <span class="status"><span class="rec"></span>live</span>
    </div>
    <div class="term-screen" id="screen">
      <div class="term-inner" id="inner">
        <div class="prompt-line" id="promptLine">&gt; decoding transmission...</div>
        <div id="typed"></div><span class="cursor" id="cursor"></span>
      </div>
    </div>
  </div>

  <!-- preload="auto" hints the browser to fetch the file eagerly; playsinline has no effect on
       <audio> but is harmless. The real fix for playback is in the script below, not this tag. -->
  <audio id="audio" src="audio.mp3" preload="auto"></audio>

<script>
(function(){
  const fullText = "If I wasn't what you wanted, you should have just left me alone. What's the point in giving me hope if you're just gonna walk away? Why get my hopes up? If it didn't mean anything. Anyway, I think we stumble into relationships more often than we walk into them falling over ourselves to get to a prize that we are convinced we need. And for so long, we continue to tell ourselves that despite any signals that are thrown our way. We are in the right place and that goes for both. You and me because I saw you as someone, I would fight to have someone worth pouring my time in energy into, but you saw me as someone that you would fight to lose. That wasn't worth the same time, but it wasn't until it was already too late. That either of us realized what we really wanted. It's just that you figured it out a little bit earlier than me and that little bit, it meant the whole world. It meant that I wasn't ready. When your time to leave, came that I wasn't ready for you to slam the door, but you had already thrown that key in the trash. You already knew that. You wouldn't need it anymore. If you knew you didn't want me, I think you would have left me. Loan. I don't think you would have approached and even considered making me your own. So, how can I be angry at someone who just wanted to give it a try? Because you can't blame someone for reaching when all they wanted to do was to catch your eye.";

  const AUDIO_DURATION_MS = 73000; // 1:13
  // Delay from tap until the audio actually starts playing.
  const AUDIO_START_DELAY_MS = 2000;
  // Typing starts together with the audio, so the words appear as the
  // speech begins rather than 1.5s ahead of it.
  const START_OFFSET_MS = AUDIO_START_DELAY_MS;
  const scrambleSet = "!<>-_\\/[]{}=+*^?#01アイウエオカキクケコサシスセソ";
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const typedEl = document.getElementById('typed');
  const screenEl = document.getElementById('screen');
  const innerEl = document.getElementById('inner');
  const gate = document.getElementById('gate');
  const audio = document.getElementById('audio');
  const promptLine = document.getElementById('promptLine');

  // TYPING_SPEED_FACTOR < 1 makes each character resolve faster. Tune this
  // down further (e.g. 0.4) for an even quicker pace, or up toward 1 to
  // slow it back down.
  const TYPING_SPEED_FACTOR = 0.55;
  const perCharDelay = Math.max(10, ((AUDIO_DURATION_MS - START_OFFSET_MS) / fullText.length) * TYPING_SPEED_FACTOR);

  // ---- Diagnostics -----------------------------------------------------
  // These fire regardless of user interaction, so open devtools (or a
  // remote-debug session for mobile Chrome via chrome://inspect) and you
  // will see exactly why playback fails: 404, wrong MIME type, decode
  // error, etc. This is what the original silent .catch(()=>{}) hid.
  audio.addEventListener('error', () => {
    const err = audio.error;
    const codes = {1:'MEDIA_ERR_ABORTED',2:'MEDIA_ERR_NETWORK',3:'MEDIA_ERR_DECODE',4:'MEDIA_ERR_SRC_NOT_SUPPORTED'};
    console.error('[audio] element error:', err ? (codes[err.code] || err.code) : 'unknown', '— check that audio.mp3 exists next to index.html, that the filename casing matches exactly (GitHub Pages is case-sensitive), and that it was actually committed (not caught by .gitignore / Git LFS).');
    showWarning('audio failed to load — see console');
  });
  audio.addEventListener('stalled', () => console.warn('[audio] stalled — network fetch is stuck'));
  audio.addEventListener('abort', () => console.warn('[audio] load aborted'));
  audio.addEventListener('loadedmetadata', () => console.log('[audio] metadata loaded, duration =', audio.duration));
  audio.addEventListener('canplaythrough', () => console.log('[audio] canplaythrough — ready to play cleanly'));

  // Force the browser to start fetching immediately rather than waiting,
  // so by the time the user taps, the file is already warm in cache.
  audio.load();

  function showWarning(msg){
    promptLine.textContent = '> ' + msg;
    promptLine.classList.add('warn');
  }

  function randChar(){
    return scrambleSet[Math.floor(Math.random() * scrambleSet.length)];
  }

  function scrollToBottom(){
    innerEl.scrollTop = innerEl.scrollHeight;
  }

  function burstGlitch(){
    screenEl.classList.add('burst');
    setTimeout(() => screenEl.classList.remove('burst'), 220);
  }

  let typingDone = false;
  let burstTimer = null;

  function scheduleBursts(){
    const next = 2500 + Math.random() * 4000;
    burstTimer = setTimeout(() => {
      if (!typingDone) burstGlitch();
      scheduleBursts();
    }, next);
  }

  async function typeChar(span, real){
    if (reduceMotion || real === ' ' || real === '\n'){
      span.textContent = real;
      return;
    }
    const frames = 2 + Math.floor(Math.random() * 2);
    for (let f = 0; f < frames; f++){
      span.textContent = randChar();
      await sleep(perCharDelay * 0.18);
    }
    span.textContent = real;
  }

  function sleep(ms){
    return new Promise(res => setTimeout(res, ms));
  }

  async function typeAll(){
    for (let i = 0; i < fullText.length; i++){
      const ch = fullText[i];
      const span = document.createElement('span');
      span.className = 'glitch-char';
      typedEl.appendChild(span);
      await typeChar(span, ch);
      scrollToBottom();
      const jitterDelay = perCharDelay * (0.75 + Math.random() * 0.5);
      await sleep(jitterDelay);
    }
    typingDone = true;
    const cursor = document.getElementById('cursor');
    if (cursor) cursor.style.animationDuration = '1s';
  }

  // ---- Single, guarded entry point --------------------------------------
  // `started` makes begin() idempotent no matter how many events land on
  // it. This is what actually fixes "audio doesn't play": previously
  // touchstart AND the trailing synthetic click both called begin(),
  // which called audio.play() twice and reset currentTime back to 0
  // right after playback started, and also kicked off typeAll() twice
  // (which appends to #typed rather than clearing it, corrupting the
  // animation). Guarding on a flag makes it truly "one interaction only".
  let started = false;

  function begin(e){
    if (started) return;
    started = true;

    if (e && e.cancelable) e.preventDefault();

    // Remove both listeners now that we've fired — belt and suspenders
    // alongside the `started` flag.
    gate.removeEventListener('touchend', begin);
    gate.removeEventListener('click', begin);

    gate.classList.add('hidden');

    // Delay the actual audio.play() call by AUDIO_START_DELAY_MS. A
    // setTimeout scheduled synchronously inside this tap handler is still
    // honored by mobile browsers' autoplay policies (Chrome/Android and
    // Safari both allow a play() call originating from a gesture-triggered
    // timer chain like this one).
    setTimeout(() => {
      audio.currentTime = 0;
      const playPromise = audio.play();
      if (playPromise && typeof playPromise.then === 'function'){
        playPromise
          .then(() => console.log('[audio] playback started successfully'))
          .catch(err => {
            // Do NOT swallow this. Common causes: file 404 (check exact
            // filename/case on GitHub Pages), unsupported format for the
            // browser, or the play() call happening outside a trusted
            // user-gesture callstack.
            console.error('[audio] play() rejected:', err.name, '-', err.message);
            showWarning('tap again — audio blocked (' + err.name + ')');
            // Allow the user to retry without a full reload.
            started = false;
            gate.classList.remove('hidden');
            gate.addEventListener('touchend', begin, { passive: false });
            gate.addEventListener('click', begin);
          });
      }
    }, AUDIO_START_DELAY_MS);

    if (!reduceMotion) scheduleBursts();
    setTimeout(typeAll, START_OFFSET_MS);
  }

  // touchend (with preventDefault) is the primary mobile trigger: it fires
  // once per tap and preventDefault() suppresses the ~300ms-later synthetic
  // click that would otherwise re-enter begin(). click alone covers mouse
  // users on desktop. The `started` guard makes the combination safe even
  // if a browser doesn't fully suppress the synthetic click.
  gate.addEventListener('touchend', begin, { passive: false });
  gate.addEventListener('click', begin);
})();
</script>
</body>
</html>
