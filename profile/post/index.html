<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Adrian Kreidehüter (@kreidehuter)</title>

<style>

:root{
  --bg-deep:#08090c;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.12);
  --text-main:#f2f2f4;
  --text-sub:#9a9aa2;
  --text-dim:#6c6c74;
}

*,
*::before,
*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:var(--text-main);
  background:var(--bg-deep);
}

body{
  background:
    radial-gradient(circle at 20% 0%, rgba(90,80,180,0.25) 0%, transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(200,60,140,0.18) 0%, transparent 45%),
    radial-gradient(circle at 30% 90%, rgba(30,140,160,0.18) 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, rgba(120,90,40,0.14) 0%, transparent 50%),
    linear-gradient(180deg, #0a0a0d 0%, #060608 100%);

  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:60px;

  animation:fadeInPage 0.6s ease;
}

@keyframes fadeInPage{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

.page{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:22px 14px 0;
}

/* PROFILE */

.profile-card{
  position:relative;
  overflow:hidden;

  background:var(--glass);

  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);

  border:1px solid var(--glass-border);
  border-radius:28px;

  box-shadow:
    0 10px 34px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.06);

  padding:22px 20px 18px;
}

.profile-card::before{
  content:"";
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:90px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0)
    );

  pointer-events:none;
}

.avatar-row{
  position:relative;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  margin-bottom:14px;
}

.avatar{
  width:84px;
  height:84px;

  border-radius:50%;
  object-fit:cover;

  border:3px solid rgba(255,255,255,0.15);

  box-shadow:
    0 6px 18px rgba(0,0,0,0.5);

  background:#222;
}

.header-actions{
  display:flex;
  gap:10px;
}

.pill-btn{
  padding:9px 18px;

  border-radius:999px;

  background:var(--glass-strong);
  border:1px solid var(--glass-border);

  color:var(--text-main);

  font-size:13.5px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1);

  transition:
    transform 0.15s ease,
    background 0.2s ease;
}

.pill-btn:hover{
  background:rgba(255,255,255,0.16);
}

.pill-btn:active{
  transform:scale(0.96);
}

.pill-btn.primary{
  background:
    linear-gradient(
      160deg,
      #f2f2f4,
      #cfcfd4
    );

  color:#0a0a0c;
  border:none;
}

.name-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.name-row h1{
  margin:0;

  font-size:22px;
  font-weight:800;
}

.lock-icon{
  width:15px;
  height:15px;

  opacity:0.7;
  flex-shrink:0;
}

.handle{
  margin:2px 0 10px;

  font-size:14.5px;
  font-weight:600;

  color:var(--text-sub);
}

.bio{
  margin:0 0 12px;

  font-size:14.5px;
  line-height:1.5;

  color:var(--text-main);
}

.meta-row{
  display:flex;
  flex-wrap:wrap;

  gap:14px;

  margin-bottom:12px;

  font-size:13px;

  color:var(--text-dim);
}

.meta-row span{
  display:flex;
  align-items:center;
  gap:5px;
}

.counts-row{
  display:flex;
  gap:18px;

  font-size:13.5px;

  color:var(--text-sub);
}

.counts-row b{
  color:var(--text-main);
  font-weight:800;
}

/* TABS */

.tab-bar{
  display:flex;
  gap:6px;

  margin:18px 0 16px;
  padding:5px;

  overflow-x:auto;

  background:var(--glass);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid var(--glass-border);
  border-radius:20px;
}

.tab{
  flex:1;

  padding:10px 12px;

  text-align:center;

  border-radius:15px;

  font-size:13.5px;
  font-weight:700;

  color:var(--text-sub);

  white-space:nowrap;
}

.tab.active{
  background:var(--glass-strong);

  color:var(--text-main);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 2px 10px rgba(0,0,0,0.3);
}

/* FEED */

.feed{
  display:flex;
  flex-direction:column;
  gap:14px;

  width:100%;
  min-width:0;
}

.post{
  width:100%;
  min-width:0;

  background:var(--glass);

  backdrop-filter:
    blur(22px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(160%);

  border:1px solid var(--glass-border);
  border-radius:24px;

  padding:16px 16px 14px;

  box-shadow:
    0 8px 26px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.05);

  animation:postIn 0.45s ease both;
}

@keyframes postIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:10px;
}

.post-avatar{
  width:40px;
  height:40px;

  flex-shrink:0;

  border-radius:50%;
  object-fit:cover;

  border:1px solid rgba(255,255,255,0.15);

  background:#222;
}

.post-names{
  display:flex;
  flex-direction:column;

  min-width:0;

  line-height:1.25;
}

.post-names .top-line{
  display:flex;
  align-items:center;

  gap:6px;

  font-size:14.5px;
  font-weight:800;

  white-space:nowrap;
}

.post-names .sub-line{
  display:flex;
  gap:6px;

  overflow:hidden;

  font-size:13px;

  color:var(--text-dim);

  white-space:nowrap;
  text-overflow:ellipsis;
}

/* CAPTION */

.post-caption{
  display:block;

  width:100%;

  margin:0 0 10px 0;
  padding:0;

  font-size:15px;
  line-height:1.5;

  color:var(--text-main);

  white-space:pre-wrap;

  overflow-wrap:anywhere;
  word-break:break-word;
}

/* MEDIA */

.post-media{
  position:relative;

  width:100%;
  max-width:100%;

  margin-top:6px;

  overflow:hidden;

  border-radius:18px;

  background:#050506;

  border:1px solid rgba(255,255,255,0.08);
}

.post-media img{
  display:block;

  width:100%;
  max-width:100%;

  height:auto;

  margin:0;
  padding:0;

  border:0;
}

/* CUSTOM VIDEO */

.video-media{
  position:relative;

  width:100%;

  background:#000;

  -webkit-user-select:none;
  user-select:none;
}

.custom-video{
  display:block;

  width:100%;
  height:auto;

  margin:0;
  padding:0;
  border:0;

  background:#000;

  cursor:pointer;
}

/* Large center play button */

.video-center-button{
  position:absolute;

  top:50%;
  left:50%;

  transform:
    translate(-50%, -50%);

  width:60px;
  height:60px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0;

  border:1px solid rgba(255,255,255,0.22);
  border-radius:50%;

  background:rgba(8,9,12,0.55);

  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);

  color:#fff;

  cursor:pointer;

  transition:
    opacity 0.2s ease,
    transform 0.15s ease,
    background 0.2s ease;

  z-index:3;
}

.video-center-button:hover{
  background:rgba(30,30,35,0.7);
}

.video-center-button:active{
  transform:
    translate(-50%, -50%)
    scale(0.92);
}

.video-center-button svg{
  width:24px;
  height:24px;

  fill:currentColor;
}

.video-media.is-playing
.video-center-button{
  opacity:0;
  pointer-events:none;
}

.video-media.show-controls.is-playing
.video-center-button{
  opacity:1;
  pointer-events:auto;
}

/* Bottom dark gradient */

.video-bottom-gradient{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  height:120px;

  background:
    linear-gradient(
      to top,
      rgba(0,0,0,0.72),
      rgba(0,0,0,0)
    );

  pointer-events:none;

  opacity:1;

  transition:
    opacity 0.25s ease;

  z-index:1;
}

.video-media.is-playing
.video-bottom-gradient{
  opacity:0;
}

.video-media.show-controls
.video-bottom-gradient{
  opacity:1;
}

/* Controls */

.video-controls{
  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:
    12px
    12px
    10px;

  z-index:4;

  opacity:1;

  transition:
    opacity 0.25s ease,
    transform 0.25s ease;

  transform:
    translateY(0);
}

.video-media.is-playing
.video-controls{
  opacity:0;
  pointer-events:none;

  transform:
    translateY(8px);
}

.video-media.show-controls
.video-controls{
  opacity:1;
  pointer-events:auto;

  transform:
    translateY(0);
}

/* Progress bar */

.video-progress-hitbox{
  width:100%;
  height:18px;

  display:flex;
  align-items:center;

  cursor:pointer;
}

.video-progress-track{
  position:relative;

  width:100%;
  height:4px;

  border-radius:999px;

  overflow:hidden;

  background:
    rgba(255,255,255,0.28);
}

.video-progress-fill{
  position:absolute;

  top:0;
  left:0;
  bottom:0;

  width:0%;

  border-radius:inherit;

  background:
    rgba(255,255,255,0.95);
}

/* Bottom row */

.video-controls-row{
  display:flex;
  align-items:center;

  gap:10px;

  margin-top:2px;
}

.video-control-button{
  width:28px;
  height:28px;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;

  margin:0;
  padding:0;

  border:none;

  background:transparent;

  color:#fff;

  cursor:pointer;
}

.video-control-button:active{
  transform:scale(0.9);
}

.video-control-button svg{
  width:18px;
  height:18px;

  fill:currentColor;
}

.video-time{
  font-size:12px;
  font-weight:700;

  color:
    rgba(255,255,255,0.92);

  font-variant-numeric:
    tabular-nums;

  white-space:nowrap;
}

.video-controls-spacer{
  flex:1;
}

.video-error{
  display:flex;

  align-items:center;
  justify-content:center;

  min-height:180px;

  padding:20px;

  text-align:center;

  color:var(--text-sub);

  font-size:14px;
}

/* STATES */

.state-box{
  padding:50px 20px;

  text-align:center;

  color:var(--text-sub);

  font-size:14.5px;
  font-weight:600;
}

.spinner{
  width:30px;
  height:30px;

  margin:0 auto 14px;

  border-radius:50%;

  border:
    3px solid
    rgba(255,255,255,0.15);

  border-top-color:
    rgba(255,255,255,0.75);

  animation:
    spin 0.8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.retry-btn{
  margin-top:14px;

  padding:10px 22px;

  border-radius:999px;

  background:var(--glass-strong);

  border:
    1px solid
    var(--glass-border);

  color:var(--text-main);

  font-weight:700;
  font-size:13.5px;

  cursor:pointer;
}

.retry-btn:active{
  transform:scale(0.96);
}

@media (max-width:420px){

  .avatar{
    width:72px;
    height:72px;
  }

  .name-row h1{
    font-size:19px;
  }

  .pill-btn{
    padding:8px 14px;
    font-size:13px;
  }

}

</style>
</head>

<body>

<div class="page">

  <div class="profile-card">

    <div class="avatar-row">

      <img
        class="avatar"
        src="../profile.jpg"
        alt="Adrian Kreidehüter"
      >

      <div class="header-actions">
        <button class="pill-btn">
          Share
        </button>

        <button class="pill-btn primary">
          Edit profile
        </button>
      </div>

    </div>

    <div class="name-row">

      <h1>
        Adrian Kreidehüter
      </h1>

      <svg
        class="lock-icon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect
          x="5"
          y="11"
          width="14"
          height="10"
          rx="2"
          stroke="currentColor"
          stroke-width="2"
        />

        <path
          d="M8 11V7a4 4 0 018 0v4"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>

    </div>

    <p class="handle">
      @kreidehuter
    </p>

    <p class="bio">
      infp t btw I want a friend
    </p>

    <div class="meta-row">
      <span>
        🎂 Born October 22, 2006
      </span>

      <span>
        📅 Joined April 2026
      </span>
    </div>

    <div class="counts-row">
      <span>
        <b>6</b> Following
      </span>

      <span>
        <b>0</b> Followers
      </span>
    </div>

  </div>

  <div class="tab-bar">
    <div class="tab active">
      Posts
    </div>

    <div class="tab">
      Replies
    </div>

    <div class="tab">
      Media
    </div>

    <div class="tab">
      Likes
    </div>
  </div>

  <div
    class="feed"
    id="feed"
  >

    <div class="state-box">
      <div class="spinner"></div>
      Loading posts...
    </div>

  </div>

</div>

<script>

(function(){

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwj8X3sQJx2OTgsorUT_iObGiJ4eXlTIp2apSuKDIgP_9AXN8xGihetgaotxZe-0QKHPw/exec";

  const feedEl =
    document.getElementById(
      "feed"
    );


  function escapeHtml(str){

    if(
      str === undefined ||
      str === null
    ){
      return "";
    }

    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function relativeTime(input){

    if(!input){
      return "";
    }

    const date =
      new Date(input);

    if(
      isNaN(
        date.getTime()
      )
    ){
      return "";
    }

    let seconds =
      Math.floor(
        (
          Date.now() -
          date.getTime()
        ) / 1000
      );

    if(seconds < 0){
      seconds = 0;
    }

    if(seconds < 5){
      return "now";
    }

    if(seconds < 60){
      return seconds + "s";
    }

    const minutes =
      Math.floor(
        seconds / 60
      );

    if(minutes < 60){
      return minutes + "m";
    }

    const hours =
      Math.floor(
        minutes / 60
      );

    if(hours < 24){
      return hours + "h";
    }

    const days =
      Math.floor(
        hours / 24
      );

    if(days < 7){
      return days + "d";
    }

    const weeks =
      Math.floor(
        days / 7
      );

    if(weeks < 5){
      return weeks + "w";
    }

    const months =
      Math.floor(
        days / 30
      );

    if(months < 12){
      return months + "mo";
    }

    const years =
      Math.floor(
        days / 365
      );

    return years + "y";

  }


  function getDriveFileId(url){

    if(!url){
      return null;
    }

    url =
      String(url).trim();

    let match =
      url.match(
        /\/file\/d\/([^\/?]+)/
      );

    if(match){
      return match[1];
    }

    match =
      url.match(
        /[?&]id=([^&#]+)/i
      );

    if(match){
      return match[1];
    }

    return null;

  }


  function normalizeMediaUrl(
    url,
    type
  ){

    if(!url){
      return null;
    }

    url =
      String(url).trim();

    const driveId =
      getDriveFileId(url);


    if(
      driveId &&
      type === "image"
    ){

      return (
        "https://drive.google.com/thumbnail?id="
        + encodeURIComponent(driveId)
        + "&sz=w2000"
      );

    }


    /*
      IMPORTANT:

      Keep the same direct Google Drive
      video method from your ORIGINAL
      working code.

      No iframe.
      No /preview player.
      No Google Drive UI.
    */

    if(
      driveId &&
      type === "video"
    ){

      return (
        "https://drive.usercontent.google.com/download?id="
        + encodeURIComponent(driveId)
        + "&export=download&confirm=t"
      );

    }

    return url;

  }


  function getMediaUrl(post){

    return (
      post.fileUrl ||
      post.fileURL ||
      post.mediaUrl ||
      post.mediaURL ||
      post.url ||
      post.imageUrl ||
      post.imageURL ||
      post.videoUrl ||
      post.videoURL ||
      post.media ||
      post.file ||
      null
    );

  }


  function getCaption(post){

    return (
      post.caption ||
      post.text ||
      post.content ||
      post.message ||
      post.body ||
      ""
    );

  }


  function getTimestamp(post){

    return (
      post.timestamp ||
      post.createdAt ||
      post.created_at ||
      post.date ||
      post.time ||
      post.created ||
      null
    );

  }


  function guessMediaType(post){

    const mime =
      String(
        post.mimeType ||
        post.mimetype ||
        post.mime ||
        post.type ||
        post.mediaType ||
        ""
      ).toLowerCase();


    if(
      mime.startsWith("video/")
    ){
      return "video";
    }


    if(
      mime.startsWith("image/")
    ){
      return "image";
    }


    if(
      mime === "video"
    ){
      return "video";
    }


    if(
      mime === "image"
    ){
      return "image";
    }


    const url =
      String(
        getMediaUrl(post) || ""
      ).toLowerCase();


    if(
      /\.(mp4|mov|webm|m4v|ogg|ogv)(\?|$)/i.test(
        url
      )
    ){
      return "video";
    }


    if(
      /\.(jpg|jpeg|png|gif|webp|heic)(\?|$)/i.test(
        url
      )
    ){
      return "image";
    }


    /*
      Google Drive URLs normally have
      no visible extension.
    */

    if(
      post.videoUrl ||
      post.videoURL
    ){
      return "video";
    }


    return "image";

  }


  function renderVideoPlayer(url){

    return `

      <div
        class="post-media video-media"
      >

        <video
          class="custom-video"
          preload="metadata"
          playsinline
          webkit-playsinline
          src="${escapeHtml(url)}"
        ></video>


        <button
          class="video-center-button"
          type="button"
          aria-label="Play or pause"
        >

          <svg
            class="play-icon"
            viewBox="0 0 24 24"
          >
            <path
              d="M8 5v14l11-7z"
            />
          </svg>

        </button>


        <div
          class="video-bottom-gradient"
        ></div>


        <div
          class="video-controls"
        >

          <div
            class="video-progress-hitbox"
          >

            <div
              class="video-progress-track"
            >

              <div
                class="video-progress-fill"
              ></div>

            </div>

          </div>


          <div
            class="video-controls-row"
          >

            <button
              class="video-control-button video-play-button"
              type="button"
              aria-label="Play or pause"
            >

              <svg
                class="play-icon"
                viewBox="0 0 24 24"
              >
                <path
                  d="M8 5v14l11-7z"
                />
              </svg>

            </button>


            <button
              class="video-control-button video-mute-button"
              type="button"
              aria-label="Mute or unmute"
            >

              <svg
                class="volume-icon"
                viewBox="0 0 24 24"
              >
                <path
                  d="M3 10v4h4l5 5V5L7 10H3zm11 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
                />
              </svg>

            </button>


            <span
              class="video-time"
            >
              0:00 / 0:00
            </span>


            <div
              class="video-controls-spacer"
            ></div>


            <button
              class="video-control-button video-fullscreen-button"
              type="button"
              aria-label="Fullscreen"
            >

              <svg
                viewBox="0 0 24 24"
              >
                <path
                  d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"
                />
              </svg>

            </button>

          </div>

        </div>

      </div>

    `;

  }


  function renderPost(post){

    const caption =
      getCaption(post);

    const rawMediaUrl =
      getMediaUrl(post);

    const mediaType =
      rawMediaUrl
        ? guessMediaType(post)
        : null;

    const mediaUrl =
      normalizeMediaUrl(
        rawMediaUrl,
        mediaType
      );

    const timeLabel =
      relativeTime(
        getTimestamp(post)
      );


    let mediaHtml =
      "";


    if(
      mediaUrl &&
      mediaType === "video"
    ){

      mediaHtml =
        renderVideoPlayer(
          mediaUrl
        );

    }


    else if(mediaUrl){

      mediaHtml =
        `
          <div class="post-media">

            <img
              src="${escapeHtml(mediaUrl)}"
              alt="Post attachment"
              loading="lazy"
            >

          </div>
        `;

    }


    const captionHtml =
      caption
        ? `<div class="post-caption">${escapeHtml(caption)}</div>`
        : "";


    return `

      <article
        class="post"
      >

        <div
          class="post-head"
        >

          <img
            class="post-avatar"
            src="../profile.jpg"
            alt="Adrian Kreidehüter"
          >


          <div
            class="post-names"
          >

            <div
              class="top-line"
            >
              Adrian Kreidehüter
            </div>


            <div
              class="sub-line"
            >

              <span>
                @kreidehuter
              </span>

              ${
                timeLabel
                  ? `<span>· ${escapeHtml(timeLabel)}</span>`
                  : ""
              }

            </div>

          </div>

        </div>


        ${captionHtml}


        ${mediaHtml}

      </article>

    `;

  }


  function formatTime(seconds){

    if(
      !isFinite(seconds) ||
      isNaN(seconds) ||
      seconds < 0
    ){
      return "0:00";
    }

    seconds =
      Math.floor(seconds);

    const minutes =
      Math.floor(
        seconds / 60
      );

    const secs =
      seconds % 60;

    return (
      minutes +
      ":" +
      (
        secs < 10
          ? "0" + secs
          : secs
      )
    );

  }


  function initCustomPlayers(){

    const players =
      feedEl.querySelectorAll(
        ".video-media"
      );


    players.forEach(
      function(player){

        if(
          player.dataset.initialized
        ){
          return;
        }


        player.dataset.initialized =
          "true";


        const video =
          player.querySelector(
            ".custom-video"
          );

        const centerButton =
          player.querySelector(
            ".video-center-button"
          );

        const playButton =
          player.querySelector(
            ".video-play-button"
          );

        const muteButton =
          player.querySelector(
            ".video-mute-button"
          );

        const fullscreenButton =
          player.querySelector(
            ".video-fullscreen-button"
          );

        const progressHitbox =
          player.querySelector(
            ".video-progress-hitbox"
          );

        const progressFill =
          player.querySelector(
            ".video-progress-fill"
          );

        const timeLabel =
          player.querySelector(
            ".video-time"
          );


        let controlsTimer =
          null;


        function showControls(){

          player.classList.add(
            "show-controls"
          );


          if(controlsTimer){

            clearTimeout(
              controlsTimer
            );

          }


          if(
            !video.paused
          ){

            controlsTimer =
              setTimeout(
                function(){

                  player.classList.remove(
                    "show-controls"
                  );

                },
                2500
              );

          }

        }


        function togglePlayback(){

          if(
            video.paused
          ){

            video.play()
              .catch(
                function(err){

                  console.error(
                    "Video play failed:",
                    err
                  );

                }
              );

          }

          else{

            video.pause();

          }

        }


        function updatePlayButtons(){

          if(
            video.paused
          ){

            player.classList.remove(
              "is-playing"
            );

            centerButton.innerHTML =
              `
                <svg
                  class="play-icon"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M8 5v14l11-7z"
                  />
                </svg>
              `;

            playButton.innerHTML =
              `
                <svg
                  class="play-icon"
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M8 5v14l11-7z"
                  />
                </svg>
              `;

          }

          else{

            player.classList.add(
              "is-playing"
            );

            centerButton.innerHTML =
              `
                <svg
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M6 5h4v14H6zM14 5h4v14h-4z"
                  />
                </svg>
              `;

            playButton.innerHTML =
              `
                <svg
                  viewBox="0 0 24 24"
                >
                  <path
                    d="M6 5h4v14H6zM14 5h4v14h-4z"
                  />
                </svg>
              `;

          }

        }


        video.addEventListener(
          "play",
          function(){

            updatePlayButtons();
            showControls();

          }
        );


        video.addEventListener(
          "pause",
          function(){

            updatePlayButtons();

            player.classList.add(
              "show-controls"
            );


            if(controlsTimer){

              clearTimeout(
                controlsTimer
              );

            }

          }
        );


        video.addEventListener(
          "ended",
          function(){

            updatePlayButtons();

            player.classList.add(
              "show-controls"
            );

          }
        );


        video.addEventListener(
          "loadedmetadata",
          function(){

            if(timeLabel){

              timeLabel.textContent =
                formatTime(
                  video.currentTime
                ) +
                " / " +
                formatTime(
                  video.duration
                );

            }

          }
        );


        video.addEventListener(
          "timeupdate",
          function(){

            if(
              !video.duration ||
              !isFinite(
                video.duration
              )
            ){
              return;
            }


            const percent =
              (
                video.currentTime /
                video.duration
              ) * 100;


            progressFill.style.width =
              percent + "%";


            timeLabel.textContent =
              formatTime(
                video.currentTime
              ) +
              " / " +
              formatTime(
                video.duration
              );

          }
        );


        video.addEventListener(
          "error",
          function(){

            console.error(
              "Video failed:",
              video.currentSrc ||
              video.src
            );


            player.innerHTML =
              `
                <div class="video-error">
                  This video couldn't be loaded.
                </div>
              `;

          }
        );


        video.addEventListener(
          "click",
          function(){

            togglePlayback();
            showControls();

          }
        );


        centerButton.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            togglePlayback();
            showControls();

          }
        );


        playButton.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            togglePlayback();
            showControls();

          }
        );


        muteButton.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            video.muted =
              !video.muted;

            muteButton.innerHTML =
              video.muted
                ? `
                    <svg
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M3 10v4h4l5 5V5L7 10H3zm13.5-2.5L15.1 8.9 18.2 12l-3.1 3.1 1.4 1.4 3.1-3.1 3.1 3.1 1.4-1.4-3.1-3.1 3.1-3.1-1.4-1.4-3.1 3.1-3.1-3.1z"
                      />
                    </svg>
                  `
                : `
                    <svg
                      viewBox="0 0 24 24"
                    >
                      <path
                        d="M3 10v4h4l5 5V5L7 10H3zm11 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
                      />
                    </svg>
                  `;

            showControls();

          }
        );


        progressHitbox.addEventListener(
          "click",
          function(e){

            e.stopPropagation();


            if(
              !video.duration ||
              !isFinite(
                video.duration
              )
            ){
              return;
            }


            const rect =
              progressHitbox.getBoundingClientRect();


            let percent =
              (
                e.clientX -
                rect.left
              ) / rect.width;


            percent =
              Math.max(
                0,
                Math.min(
                  1,
                  percent
                )
              );


            video.currentTime =
              percent *
              video.duration;


            showControls();

          }
        );


        fullscreenButton.addEventListener(
          "click",
          function(e){

            e.stopPropagation();


            if(
              player.requestFullscreen
            ){

              player.requestFullscreen();

            }

            else if(
              player.webkitRequestFullscreen
            ){

              player.webkitRequestFullscreen();

            }

            else if(
              video.webkitEnterFullscreen
            ){

              video.webkitEnterFullscreen();

            }


            showControls();

          }
        );


        player.addEventListener(
          "mousemove",
          showControls
        );


        player.addEventListener(
          "touchstart",
          showControls,
          {
            passive:true
          }
        );


        updatePlayButtons();

      }
    );

  }


  function attachMediaErrorHandlers(){

    const images =
      feedEl.querySelectorAll(
        ".post-media img"
      );


    images.forEach(
      function(img){

        img.addEventListener(
          "error",
          function(){

            const mediaBox =
              img.closest(
                ".post-media"
              );


            if(mediaBox){

              mediaBox.innerHTML =
                `
                  <div class="video-error">
                    Couldn't load image.
                  </div>
                `;

            }

          }
        );

      }
    );

  }


  function showState(html){

    feedEl.innerHTML =
      `
        <div class="state-box">
          ${html}
        </div>
      `;

  }


  function showLoading(){

    showState(
      `
        <div class="spinner"></div>
        Loading posts...
      `
    );

  }


  function showEmpty(){

    showState(
      "No posts yet."
    );

  }


  function showError(){

    showState(
      `
        Couldn't load posts.
        Please check your connection.

        <div>
          <button
            class="retry-btn"
            id="retryBtn"
          >
            Retry
          </button>
        </div>
      `
    );


    const retryBtn =
      document.getElementById(
        "retryBtn"
      );


    if(retryBtn){

      retryBtn.addEventListener(
        "click",
        loadPosts
      );

    }

  }


  function sortPostsNewestFirst(posts){

    return posts
      .slice()
      .sort(
        function(a, b){

          const timeA =
            new Date(
              getTimestamp(a) || 0
            ).getTime();

          const timeB =
            new Date(
              getTimestamp(b) || 0
            ).getTime();


          return (
            timeB -
            timeA
          );

        }
      );

  }


  async function loadPosts(){

    showLoading();


    try{

      const response =
        await fetch(
          API_URL,
          {
            method:"GET",
            cache:"no-store"
          }
        );


      if(
        !response.ok
      ){

        throw new Error(
          "Bad response"
        );

      }


      const data =
        await response.json();


      if(
        !data ||
        data.success === false
      ){

        showError();

        return;

      }


      let posts =
        data.posts ||
        data.data ||
        data.items ||
        [];


      if(
        !Array.isArray(posts)
      ){

        posts = [];

      }


      if(
        posts.length === 0
      ){

        showEmpty();

        return;

      }


      posts =
        sortPostsNewestFirst(
          posts
        );


      feedEl.innerHTML =
        posts
          .map(
            renderPost
          )
          .join("");


      attachMediaErrorHandlers();

      initCustomPlayers();


    }
    catch(err){

      console.error(
        "Failed to load posts:",
        err
      );

      showError();

    }

  }


  loadPosts();

})();

</script>
