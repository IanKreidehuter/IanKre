<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Adrian Kreidehüter (@kreidehuter)</title>

<style>

:root{
  --bg-deep:#08090c;
  --glass:rgba(255,255,255,0.06);
  --glass-strong:rgba(255,255,255,0.10);
  --glass-border:rgba(255,255,255,0.12);
  --text-main:#f2f2f4;
  --text-sub:#9a9aa2;
  --text-dim:#6c6c74;
}

*,
*::before,
*::after{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  overflow-x:hidden;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  color:var(--text-main);
  background:var(--bg-deep);
}

body{
  background:
    radial-gradient(circle at 20% 0%, rgba(90,80,180,0.25) 0%, transparent 45%),
    radial-gradient(circle at 85% 10%, rgba(200,60,140,0.18) 0%, transparent 45%),
    radial-gradient(circle at 30% 90%, rgba(30,140,160,0.18) 0%, transparent 50%),
    radial-gradient(circle at 90% 90%, rgba(120,90,40,0.14) 0%, transparent 50%),
    linear-gradient(180deg, #0a0a0d 0%, #060608 100%);

  background-attachment:fixed;
  min-height:100vh;
  padding-bottom:60px;

  animation:fadeInPage 0.6s ease;
}

@keyframes fadeInPage{
  from{
    opacity:0;
  }

  to{
    opacity:1;
  }
}

.page{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:22px 14px 0;
}

/* PROFILE */

.profile-card{
  position:relative;
  overflow:hidden;

  background:var(--glass);

  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);

  border:1px solid var(--glass-border);
  border-radius:28px;

  box-shadow:
    0 10px 34px rgba(0,0,0,0.4),
    inset 0 1px 0 rgba(255,255,255,0.06);

  padding:22px 20px 18px;
}

.profile-card::before{
  content:"";
  position:absolute;

  top:0;
  left:0;
  right:0;

  height:90px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,0.08),
      rgba(255,255,255,0)
    );

  pointer-events:none;
}

.avatar-row{
  position:relative;

  display:flex;
  align-items:flex-end;
  justify-content:space-between;

  margin-bottom:14px;
}

.avatar{
  width:84px;
  height:84px;

  border-radius:50%;
  object-fit:cover;

  border:3px solid rgba(255,255,255,0.15);

  box-shadow:
    0 6px 18px rgba(0,0,0,0.5);

  background:#222;
}

.header-actions{
  display:flex;
  gap:10px;
}

.pill-btn{
  padding:9px 18px;

  border-radius:999px;

  background:var(--glass-strong);
  border:1px solid var(--glass-border);

  color:var(--text-main);

  font-size:13.5px;
  font-weight:700;

  cursor:pointer;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.1);

  transition:
    transform 0.15s ease,
    background 0.2s ease;
}

.pill-btn:hover{
  background:rgba(255,255,255,0.16);
}

.pill-btn:active{
  transform:scale(0.96);
}

.pill-btn.primary{
  background:
    linear-gradient(
      160deg,
      #f2f2f4,
      #cfcfd4
    );

  color:#0a0a0c;
  border:none;
}

.name-row{
  display:flex;
  align-items:center;
  gap:6px;
}

.name-row h1{
  margin:0;

  font-size:22px;
  font-weight:800;
}

.lock-icon{
  width:15px;
  height:15px;

  opacity:0.7;
  flex-shrink:0;
}

.handle{
  margin:2px 0 10px;

  font-size:14.5px;
  font-weight:600;

  color:var(--text-sub);
}

.bio{
  margin:0 0 12px;

  font-size:14.5px;
  line-height:1.5;

  color:var(--text-main);
}

.meta-row{
  display:flex;
  flex-wrap:wrap;

  gap:14px;

  margin-bottom:12px;

  font-size:13px;

  color:var(--text-dim);
}

.meta-row span{
  display:flex;
  align-items:center;
  gap:5px;
}

.counts-row{
  display:flex;
  gap:18px;

  font-size:13.5px;

  color:var(--text-sub);
}

.counts-row b{
  color:var(--text-main);
  font-weight:800;
}

/* TABS */

.tab-bar{
  display:flex;
  gap:6px;

  margin:18px 0 16px;
  padding:5px;

  overflow-x:auto;

  background:var(--glass);

  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);

  border:1px solid var(--glass-border);
  border-radius:20px;
}

.tab{
  flex:1;

  padding:10px 12px;

  text-align:center;

  border-radius:15px;

  font-size:13.5px;
  font-weight:700;

  color:var(--text-sub);

  white-space:nowrap;
}

.tab.active{
  background:var(--glass-strong);

  color:var(--text-main);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.12),
    0 2px 10px rgba(0,0,0,0.3);
}

/* FEED */

.feed{
  display:flex;
  flex-direction:column;
  gap:14px;

  width:100%;
  min-width:0;
}

.post{
  width:100%;
  min-width:0;

  background:var(--glass);

  backdrop-filter:
    blur(22px)
    saturate(160%);

  -webkit-backdrop-filter:
    blur(22px)
    saturate(160%);

  border:1px solid var(--glass-border);
  border-radius:24px;

  padding:16px 16px 14px;

  box-shadow:
    0 8px 26px rgba(0,0,0,0.35),
    inset 0 1px 0 rgba(255,255,255,0.05);

  animation:postIn 0.45s ease both;
}

@keyframes postIn{
  from{
    opacity:0;
    transform:translateY(10px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

.post-head{
  display:flex;
  align-items:center;
  gap:10px;

  margin-bottom:10px;
}

.post-avatar{
  width:40px;
  height:40px;

  flex-shrink:0;

  border-radius:50%;
  object-fit:cover;

  border:1px solid rgba(255,255,255,0.15);

  background:#222;
}

.post-names{
  display:flex;
  flex-direction:column;

  min-width:0;

  line-height:1.25;
}

.post-names .top-line{
  display:flex;
  align-items:center;

  gap:6px;

  font-size:14.5px;
  font-weight:800;

  white-space:nowrap;
}

.post-names .sub-line{
  display:flex;
  gap:6px;

  overflow:hidden;

  font-size:13px;

  color:var(--text-dim);

  white-space:nowrap;
  text-overflow:ellipsis;
}

/* CAPTION */

.post-caption{
  display:block;

  width:100%;

  margin:0 0 10px 0;
  padding:0;

  font-size:15px;
  line-height:1.5;

  color:var(--text-main);

  white-space:pre-wrap;

  overflow-wrap:anywhere;
  word-break:break-word;
}

/* MEDIA */

.post-media{
  position:relative;

  width:100%;
  max-width:100%;

  margin-top:6px;

  overflow:hidden;

  border-radius:18px;

  background:#050506;

  border:1px solid rgba(255,255,255,0.08);
}

.post-media img{
  display:block;

  width:100%;
  max-width:100%;

  height:auto;

  margin:0;
  padding:0;

  border:0;
}

.post-media iframe{
  display:block;

  width:100%;
  max-width:100%;

  aspect-ratio:16 / 9;

  min-height:220px;

  margin:0;
  padding:0;

  border:0;

  background:#000;
}

/* CUSTOM VIDEO PLAYER */

.video-media{
  position:relative;
  cursor:pointer;

  /* prevents accidental text-selection / callouts on long-press (mobile) */
  -webkit-user-select:none;
  user-select:none;
}

.video-media video.custom-video{
  display:block;

  width:100%;
  max-width:100%;

  height:auto;

  margin:0;
  padding:0;
  border:0;

  background:#000;
}

/* hide native controls across browsers */
.video-media video.custom-video::-webkit-media-controls,
.video-media video.custom-video::-webkit-media-controls-panel,
.video-media video.custom-video::-webkit-media-controls-start-playback-button{
  display:none !important;
  -webkit-appearance:none;
}

.video-media video.custom-video::-moz-media-controls{
  display:none !important;
}

.video-overlay-gradient{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  height:96px;

  background:linear-gradient(
    180deg,
    rgba(0,0,0,0) 0%,
    rgba(0,0,0,0.55) 100%
  );

  pointer-events:none;

  opacity:0;
  transition:opacity 0.25s ease;
}

.video-media.controls-visible .video-overlay-gradient,
.video-media:not(.is-playing) .video-overlay-gradient{
  opacity:1;
}

.video-center-play{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);

  width:58px;
  height:58px;

  border-radius:50%;

  background:rgba(10,10,12,0.45);

  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);

  border:1px solid rgba(255,255,255,0.22);

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  padding:0;

  opacity:0;
  pointer-events:none;

  transition:opacity 0.2s ease, transform 0.15s ease;
}

.video-media:not(.is-playing) .video-center-play{
  opacity:1;
  pointer-events:auto;
}

.video-media.is-playing.controls-visible .video-center-play{
  opacity:1;
  pointer-events:auto;
}

.video-center-play:active{
  transform:translate(-50%,-50%) scale(0.92);
}

.video-center-play svg{
  width:22px;
  height:22px;
  fill:#f2f2f4;
}

.video-center-play svg.icon-play{
  margin-left:3px;
}

.video-center-play svg.icon-pause{
  display:none;
}

.video-media.is-playing .video-center-play svg.icon-play{
  display:none;
}

.video-media.is-playing .video-center-play svg.icon-pause{
  display:block;
}

.video-controls-bar{
  position:absolute;
  left:0;
  right:0;
  bottom:0;

  padding:8px 12px 10px;

  opacity:0;
  transform:translateY(6px);

  pointer-events:none;

  transition:opacity 0.25s ease, transform 0.25s ease;
}

.video-media.controls-visible .video-controls-bar,
.video-media:not(.is-playing) .video-controls-bar{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}

.video-progress-container{
  position:relative;

  width:100%;
  height:16px;

  display:flex;
  align-items:center;

  cursor:pointer;
}

.video-progress-track{
  width:100%;
  height:3px;

  border-radius:999px;

  background:rgba(255,255,255,0.25);

  position:relative;
  overflow:hidden;
}

.video-progress-fill{
  position:absolute;
  left:0;
  top:0;
  bottom:0;

  width:0%;

  background:rgba(242,242,244,0.9);

  border-radius:999px;
}

.video-controls-row{
  display:flex;
  align-items:center;
  gap:10px;

  margin-top:2px;
}

.video-icon-btn{
  width:26px;
  height:26px;

  flex-shrink:0;

  border:none;
  background:transparent;

  display:flex;
  align-items:center;
  justify-content:center;

  cursor:pointer;
  padding:0;
}

.video-icon-btn svg{
  width:17px;
  height:17px;
  fill:#f2f2f4;
}

.video-time{
  font-size:12px;
  font-weight:700;

  color:rgba(242,242,244,0.92);

  white-space:nowrap;

  font-variant-numeric:tabular-nums;
}

.video-controls-row .video-spacer{
  flex:1;
}

.video-error{
  padding:34px 16px;

  text-align:center;

  font-size:13.5px;
  font-weight:600;

  color:var(--text-sub);
}

/* STATES */

.state-box{
  padding:50px 20px;

  text-align:center;

  color:var(--text-sub);

  font-size:14.5px;
  font-weight:600;
}

.spinner{
  width:30px;
  height:30px;

  margin:0 auto 14px;

  border-radius:50%;

  border:3px solid rgba(255,255,255,0.15);
  border-top-color:rgba(255,255,255,0.75);

  animation:spin 0.8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.retry-btn{
  margin-top:14px;
  padding:10px 22px;

  border-radius:999px;

  background:var(--glass-strong);

  border:1px solid var(--glass-border);

  color:var(--text-main);

  font-weight:700;
  font-size:13.5px;

  cursor:pointer;
}

.retry-btn:active{
  transform:scale(0.96);
}

@media (max-width:420px){

  .avatar{
    width:72px;
    height:72px;
  }

  .name-row h1{
    font-size:19px;
  }

  .pill-btn{
    padding:8px 14px;
    font-size:13px;
  }

}

</style>
</head>

<body>

<div class="page">

  <div class="profile-card">

    <div class="avatar-row">

      <img
        class="avatar"
        src="../profile.jpg"
        alt="Adrian Kreidehüter"
      >

      <div class="header-actions">
        <button class="pill-btn">Share</button>
        <button class="pill-btn primary">Edit profile</button>
      </div>

    </div>

    <div class="name-row">

      <h1>Adrian Kreidehüter</h1>

      <svg
        class="lock-icon"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <rect
          x="5"
          y="11"
          width="14"
          height="10"
          rx="2"
          stroke="currentColor"
          stroke-width="2"
        />

        <path
          d="M8 11V7a4 4 0 018 0v4"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>

    </div>

    <p class="handle">@kreidehuter</p>

    <p class="bio">infp t btw I want a friend</p>

    <div class="meta-row">
      <span>🎂 Born October 22, 2006</span>
      <span>📅 Joined April 2026</span>
    </div>

    <div class="counts-row">
      <span><b>6</b> Following</span>
      <span><b>0</b> Followers</span>
    </div>

  </div>

  <div class="tab-bar">
    <div class="tab active">Posts</div>
    <div class="tab">Replies</div>
    <div class="tab">Media</div>
    <div class="tab">Likes</div>
  </div>

  <div class="feed" id="feed">

    <div class="state-box">
      <div class="spinner"></div>
      Loading posts...
    </div>

  </div>

</div>

<script>

(function(){

  const API_URL =
    "https://script.google.com/macros/s/AKfycbwj8X3sQJx2OTgsorUT_iObGiJ4eXlTIp2apSuKDIgP_9AXN8xGihetgaotxZe-0QKHPw/exec";

  const feedEl =
    document.getElementById("feed");


  function escapeHtml(str){

    if(
      str === undefined ||
      str === null
    ){
      return "";
    }

    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function relativeTime(input){

    if(!input){
      return "";
    }

    const date =
      new Date(input);

    if(
      isNaN(date.getTime())
    ){
      return "";
    }

    let seconds =
      Math.floor(
        (Date.now() - date.getTime())
        / 1000
      );

    if(seconds < 0){
      seconds = 0;
    }

    if(seconds < 5){
      return "now";
    }

    if(seconds < 60){
      return seconds + "s";
    }

    const minutes =
      Math.floor(seconds / 60);

    if(minutes < 60){
      return minutes + "m";
    }

    const hours =
      Math.floor(minutes / 60);

    if(hours < 24){
      return hours + "h";
    }

    const days =
      Math.floor(hours / 24);

    if(days < 7){
      return days + "d";
    }

    const weeks =
      Math.floor(days / 7);

    if(weeks < 5){
      return weeks + "w";
    }

    const months =
      Math.floor(days / 30);

    if(months < 12){
      return months + "mo";
    }

    const years =
      Math.floor(days / 365);

    return years + "y";
  }


  function getDriveFileId(url){

    if(!url){
      return null;
    }

    url =
      String(url).trim();

    let match =
      url.match(
        /\/file\/d\/([^\/?]+)/
      );

    if(match){
      return match[1];
    }

    match =
      url.match(
        /[?&]id=([^&#]+)/i
      );

    if(match){
      return match[1];
    }

    return null;
  }


  function getMediaUrl(post){

    return (
      post.fileUrl ||
      post.fileURL ||
      post.mediaUrl ||
      post.mediaURL ||
      post.url ||
      post.imageUrl ||
      post.imageURL ||
      post.videoUrl ||
      post.videoURL ||
      post.media ||
      post.file ||
      null
    );
  }


  function getCaption(post){

    return (
      post.caption ||
      post.text ||
      post.content ||
      post.message ||
      post.body ||
      ""
    );
  }


  function getTimestamp(post){

    return (
      post.timestamp ||
      post.createdAt ||
      post.created_at ||
      post.date ||
      post.time ||
      post.created ||
      null
    );
  }


  function guessMediaType(post){

    const mime =
      String(
        post.mimeType ||
        post.mimetype ||
        post.mime ||
        post.type ||
        post.mediaType ||
        ""
      ).toLowerCase();

    if(
      mime.startsWith("video/")
    ){
      return "video";
    }

    if(
      mime.startsWith("image/")
    ){
      return "image";
    }

    if(
      mime === "video"
    ){
      return "video";
    }

    if(
      mime === "image"
    ){
      return "image";
    }


    const url =
      String(
        getMediaUrl(post) || ""
      ).toLowerCase();


    if(
      /\.(mp4|mov|webm|m4v|ogg|ogv)(\?|$)/i.test(url)
    ){
      return "video";
    }


    if(
      /\.(jpg|jpeg|png|gif|webp|heic)(\?|$)/i.test(url)
    ){
      return "image";
    }


    /*
      Google Drive links do not normally
      contain the file extension.

      Check common video fields.
    */

    if(
      post.videoUrl ||
      post.videoURL
    ){
      return "video";
    }


    return "image";
  }


  function createDrivePreviewUrl(fileId){

    return (
      "https://drive.google.com/file/d/"
      + encodeURIComponent(fileId)
      + "/preview"
    );
  }


  function normalizeImageUrl(url){

    if(!url){
      return null;
    }

    url =
      String(url).trim();

    const driveId =
      getDriveFileId(url);

    if(driveId){

      return (
        "https://drive.google.com/thumbnail?id="
        + encodeURIComponent(driveId)
        + "&sz=w2000"
      );

    }

    return url;
  }


  /* ------------------------------------------------------------
     Custom video player markup (used only for direct video URLs,
     i.e. NOT the Google Drive iframe player, which already ships
     its own controls and can't be restyled since it's a
     cross-origin iframe).
  ------------------------------------------------------------ */

  function renderCustomVideoMarkup(url){

    return `

      <video
        class="custom-video"
        preload="metadata"
        playsinline
        webkit-playsinline
        src="${escapeHtml(url)}"
      ></video>

      <div class="video-overlay-gradient"></div>

      <button
        class="video-center-play"
        type="button"
        aria-label="Play or pause video"
      >

        <svg class="icon-play" viewBox="0 0 24 24">
          <path d="M8 5v14l11-7z"/>
        </svg>

        <svg class="icon-pause" viewBox="0 0 24 24">
          <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
        </svg>

      </button>

      <div class="video-controls-bar">

        <div class="video-progress-container">
          <div class="video-progress-track">
            <div class="video-progress-fill"></div>
          </div>
        </div>

        <div class="video-controls-row">

          <button
            class="video-icon-btn video-mute-btn"
            type="button"
            aria-label="Mute or unmute video"
          >

            <svg class="icon-vol-on" viewBox="0 0 24 24">
              <path d="M3 10v4h4l5 5V5L7 10H3zm13.5 2c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
            </svg>

            <svg class="icon-vol-off" viewBox="0 0 24 24" style="display:none">
              <path d="M3 10v4h4l5 5V5L7 10H3zm13.6-3.1l-1.42 1.42L16.6 10l-1.42 1.42 1.42 1.42L18 11.42l1.4 1.42 1.42-1.42L19.4 10l1.42-1.42L19.4 7.16 18 8.58z"/>
            </svg>

          </button>

          <span class="video-time">0:00 / 0:00</span>

          <div class="video-spacer"></div>

          <button
            class="video-icon-btn video-fullscreen-btn"
            type="button"
            aria-label="Fullscreen"
          >

            <svg viewBox="0 0 24 24">
              <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
            </svg>

          </button>

        </div>

      </div>

    `;

  }


  function renderPost(post){

    const caption =
      getCaption(post);

    const rawMediaUrl =
      getMediaUrl(post);

    const mediaType =
      rawMediaUrl
        ? guessMediaType(post)
        : null;

    const driveId =
      rawMediaUrl
        ? getDriveFileId(rawMediaUrl)
        : null;

    const timeLabel =
      relativeTime(
        getTimestamp(post)
      );

    let mediaHtml =
      "";


    /*
      VIDEO
    */

    if(
      rawMediaUrl &&
      mediaType === "video"
    ){

      /*
        Google Drive video:
        use Drive's preview player.

        This is much more reliable than
        trying to force a download URL
        into an HTML video element, and
        since it's a cross-origin iframe
        we can't restyle its controls -
        Drive's own UI is used as-is.
      */

      if(driveId){

        const previewUrl =
          createDrivePreviewUrl(
            driveId
          );

        mediaHtml =
          `<div class="post-media video-media">

            <iframe
              src="${escapeHtml(previewUrl)}"
              title="Post video"
              allow="autoplay"
              allowfullscreen
              loading="lazy"
            ></iframe>

          </div>`;

      }

      /*
        Normal direct video URL -
        gets the custom player UI.
      */

      else{

        mediaHtml =
          `<div class="post-media video-media">

            ${renderCustomVideoMarkup(rawMediaUrl)}

          </div>`;

      }

    }


    /*
      IMAGE
    */

    else if(rawMediaUrl){

      const imageUrl =
        normalizeImageUrl(
          rawMediaUrl
        );

      mediaHtml =
        `<div class="post-media">

          <img
            src="${escapeHtml(imageUrl)}"
            alt="Post attachment"
            loading="lazy"
          >

        </div>`;

    }


    const captionHtml =
      caption
        ? `<div class="post-caption">${escapeHtml(caption)}</div>`
        : "";


    return `

      <article class="post">

        <div class="post-head">

          <img
            class="post-avatar"
            src="../profile.jpg"
            alt="Adrian Kreidehüter"
          >

          <div class="post-names">

            <div class="top-line">
              Adrian Kreidehüter
            </div>

            <div class="sub-line">

              <span>
                @kreidehuter
              </span>

              ${
                timeLabel
                  ? `<span>· ${escapeHtml(timeLabel)}</span>`
                  : ""
              }

            </div>

          </div>

        </div>

        ${captionHtml}

        ${mediaHtml}

      </article>
    `;
  }


  function attachMediaErrorHandlers(){

    const images =
      feedEl.querySelectorAll(
        ".post-media img"
      );

    images.forEach(function(img){

      img.addEventListener(
        "error",
        function(){

          const mediaBox =
            img.closest(
              ".post-media"
            );

          if(mediaBox){

            mediaBox.innerHTML =
              `<div class="video-error">
                Couldn't load image.
              </div>`;

          }

        }
      );

    });

    /*
      Video error handling is now wired up
      inside initCustomVideoPlayers(), since
      the custom player needs the same
      "error" event to also tear down its
      controls UI, not just swap in a
      message.
    */

  }


  /* ------------------------------------------------------------
     Wires up play/pause, progress, mute, and fullscreen for every
     custom video player currently in the feed. Safe to call
     repeatedly - already-initialized players are skipped.
  ------------------------------------------------------------ */

  function initCustomVideoPlayers(){

    const players =
      feedEl.querySelectorAll(
        ".video-media"
      );

    players.forEach(function(wrap){

      if(wrap.dataset.videoInit){
        return;
      }

      const video =
        wrap.querySelector(
          ".custom-video"
        );

      if(!video){
        /* this is the Drive iframe case - nothing to wire up */
        return;
      }

      wrap.dataset.videoInit = "true";

      const centerBtn =
        wrap.querySelector(".video-center-play");

      const progressContainer =
        wrap.querySelector(".video-progress-container");

      const progressFill =
        wrap.querySelector(".video-progress-fill");

      const timeLabel =
        wrap.querySelector(".video-time");

      const muteBtn =
        wrap.querySelector(".video-mute-btn");

      const volOnIcon =
        wrap.querySelector(".icon-vol-on");

      const volOffIcon =
        wrap.querySelector(".icon-vol-off");

      const fullscreenBtn =
        wrap.querySelector(".video-fullscreen-btn");

      let hideControlsTimeout =
        null;


      function formatTime(sec){

        if(
          !isFinite(sec) ||
          isNaN(sec) ||
          sec < 0
        ){
          return "0:00";
        }

        sec =
          Math.floor(sec);

        const m =
          Math.floor(sec / 60);

        const s =
          sec % 60;

        return (
          m + ":" +
          (s < 10 ? "0" + s : s)
        );

      }


      function showControls(){

        wrap.classList.add(
          "controls-visible"
        );

        if(hideControlsTimeout){

          clearTimeout(
            hideControlsTimeout
          );

        }

        if(!video.paused){

          hideControlsTimeout =
            setTimeout(
              function(){

                wrap.classList.remove(
                  "controls-visible"
                );

              },
              2800
            );

        }

      }


      function togglePlay(){

        if(video.paused){

          video.play().catch(
            function(){
              /* autoplay / play() rejection - ignore */
            }
          );

        }
        else{

          video.pause();

        }

      }


      video.addEventListener(
        "play",
        function(){

          wrap.classList.add(
            "is-playing"
          );

          showControls();

        }
      );

      video.addEventListener(
        "pause",
        function(){

          wrap.classList.remove(
            "is-playing"
          );

          wrap.classList.add(
            "controls-visible"
          );

          if(hideControlsTimeout){

            clearTimeout(
              hideControlsTimeout
            );

          }

        }
      );

      video.addEventListener(
        "ended",
        function(){

          wrap.classList.remove(
            "is-playing"
          );

          wrap.classList.add(
            "controls-visible"
          );

        }
      );

      video.addEventListener(
        "loadedmetadata",
        function(){

          if(timeLabel){

            timeLabel.textContent =
              formatTime(0) +
              " / " +
              formatTime(video.duration);

          }

        }
      );

      video.addEventListener(
        "timeupdate",
        function(){

          if(
            !video.duration ||
            isNaN(video.duration)
          ){
            return;
          }

          const pct =
            (video.currentTime / video.duration) * 100;

          if(progressFill){

            progressFill.style.width =
              pct + "%";

          }

          if(timeLabel){

            timeLabel.textContent =
              formatTime(video.currentTime) +
              " / " +
              formatTime(video.duration);

          }

        }
      );

      video.addEventListener(
        "error",
        function(){

          const mediaBox =
            video.closest(
              ".post-media"
            );

          if(mediaBox){

            mediaBox.innerHTML =
              `<div class="video-error">
                This video couldn't be loaded.
              </div>`;

          }

        }
      );


      /* Tap the video itself: play/pause + reveal controls */

      video.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          togglePlay();

          showControls();

        }
      );


      if(centerBtn){

        centerBtn.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            togglePlay();

            showControls();

          }
        );

      }


      if(progressContainer){

        progressContainer.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            if(
              !video.duration ||
              isNaN(video.duration)
            ){
              return;
            }

            const rect =
              progressContainer.getBoundingClientRect();

            const ratio =
              (e.clientX - rect.left) / rect.width;

            video.currentTime =
              Math.max(
                0,
                Math.min(1, ratio)
              ) * video.duration;

            showControls();

          }
        );

      }


      if(muteBtn){

        muteBtn.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            video.muted =
              !video.muted;

            if(volOnIcon && volOffIcon){

              volOnIcon.style.display =
                video.muted ? "none" : "block";

              volOffIcon.style.display =
                video.muted ? "block" : "none";

            }

            showControls();

          }
        );

      }


      if(fullscreenBtn){

        fullscreenBtn.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            if(video.requestFullscreen){

              video.requestFullscreen();

            }
            else if(video.webkitEnterFullscreen){

              /* iOS Safari - fullscreens the <video> natively */
              video.webkitEnterFullscreen();

            }
            else if(video.webkitRequestFullscreen){

              video.webkitRequestFullscreen();

            }

            showControls();

          }
        );

      }

    });

  }


  function showState(html){

    feedEl.innerHTML =
      `
        <div class="state-box">
          ${html}
        </div>
      `;
  }


  function showLoading(){

    showState(
      `
        <div class="spinner"></div>
        Loading posts...
      `
    );

  }


  function showEmpty(){

    showState(
      "No posts yet."
    );

  }


  function showError(){

    showState(
      `
        Couldn't load posts.
        Please check your connection.

        <div>
          <button
            class="retry-btn"
            id="retryBtn"
          >
            Retry
          </button>
        </div>
      `
    );

    const retryBtn =
      document.getElementById(
        "retryBtn"
      );

    if(retryBtn){

      retryBtn.addEventListener(
        "click",
        loadPosts
      );

    }

  }


  function sortPostsNewestFirst(posts){

    return posts
      .slice()
      .sort(
        function(a, b){

          const ta =
            new Date(
              getTimestamp(a) || 0
            ).getTime();

          const tb =
            new Date(
              getTimestamp(b) || 0
            ).getTime();

          return tb - ta;

        }
      );

  }


  async function loadPosts(){

    showLoading();

    try{

      const response =
        await fetch(
          API_URL,
          {
            method:"GET",
            cache:"no-store"
          }
        );

      if(
        !response.ok
      ){
        throw new Error(
          "Bad response"
        );
      }

      const data =
        await response.json();

      if(
        !data ||
        data.success === false
      ){

        showError();
        return;

      }

      let posts =
        data.posts ||
        data.data ||
        data.items ||
        [];

      if(
        !Array.isArray(posts)
      ){
        posts = [];
      }

      if(
        posts.length === 0
      ){

        showEmpty();
        return;

      }

      posts =
        sortPostsNewestFirst(
          posts
        );

      feedEl.innerHTML =
        posts
          .map(renderPost)
          .join("");

      attachMediaErrorHandlers();

      initCustomVideoPlayers();

    }
    catch(err){

      console.error(
        "Failed to load posts:",
        err
      );

      showError();

    }

  }


  loadPosts();

})();

</script>

</body>
