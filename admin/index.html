<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">

<title>LIAM — Admin</title>

<style>

:root{
  --bg:#f4f4f2;
  --panel:rgba(255,255,255,.72);
  --text:#111;
  --muted:#777;
  --border:rgba(0,0,0,.09);
  --danger:#c62828;
  --radius:22px;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(
      circle at top left,
      rgba(255,255,255,.95),
      transparent 35%
    ),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
  padding:40px 0 80px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  margin-bottom:32px;
}

.brand h1{
  font-size:30px;
  letter-spacing:-.04em;
}

.brand p{
  color:var(--muted);
  font-size:14px;
  margin-top:5px;
}

.new-post-button{
  border:0;
  border-radius:14px;
  padding:12px 18px;
  background:#111;
  color:#fff;
  font-weight:600;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  gap:14px;
  margin-bottom:22px;
}

.search{
  width:100%;
  max-width:430px;
}

.search input,
.filter{
  width:100%;
  height:46px;
  border:1px solid var(--border);
  border-radius:14px;
  padding:0 15px;
  outline:none;
  background:rgba(255,255,255,.7);
}

.filter{
  width:auto;
}

.posts{
  display:grid;
  gap:14px;
}

.post-card{
  display:grid;
  grid-template-columns:110px 1fr auto;
  align-items:center;
  gap:20px;
  padding:16px;
  border:1px solid var(--border);
  border-radius:var(--radius);
  background:var(--panel);
  backdrop-filter:blur(18px);
  box-shadow:0 18px 50px rgba(0,0,0,.08);
}

.post-media{
  width:110px;
  height:80px;
  border-radius:15px;
  overflow:hidden;
  background:#e9e9e7;
  display:flex;
  align-items:center;
  justify-content:center;
}

.post-media img,
.post-media video{
  width:100%;
  height:100%;
  object-fit:cover;
}

.no-media{
  font-size:12px;
  color:var(--muted);
}

.post-info{
  min-width:0;
}

.post-title{
  font-size:17px;
  font-weight:650;
  margin-bottom:5px;
}

.post-caption{
  color:var(--muted);
  font-size:14px;
  margin-bottom:9px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.post-meta{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:12px;
}

.status{
  padding:4px 8px;
  border-radius:999px;
  font-size:11px;
  font-weight:600;
  text-transform:uppercase;
}

.status.published{
  background:#e4f3e7;
  color:#246331;
}

.status.draft{
  background:#eee;
  color:#666;
}

.post-actions{
  display:flex;
  gap:8px;
}

.action-button{
  height:38px;
  padding:0 13px;
  border-radius:11px;
  border:1px solid var(--border);
  background:white;
  font-size:13px;
  font-weight:600;
}

.action-button.delete{
  color:var(--danger);
}

.state{
  padding:70px 20px;
  text-align:center;
  border:1px dashed rgba(0,0,0,.14);
  border-radius:var(--radius);
  color:var(--muted);
}

.state strong{
  display:block;
  color:#111;
  margin-bottom:7px;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.38);
  backdrop-filter:blur(8px);
  z-index:1000;
}

.modal-backdrop.active{
  display:flex;
}

.modal{
  width:min(720px,100%);
  max-height:calc(100vh - 40px);
  overflow-y:auto;
  border-radius:24px;
  background:rgba(255,255,255,.96);
  box-shadow:0 30px 100px rgba(0,0,0,.2);
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:22px 24px;
  border-bottom:1px solid var(--border);
}

.close-button{
  width:36px;
  height:36px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:20px;
}

.form{
  padding:24px;
  display:grid;
  gap:18px;
}

.field{
  display:grid;
  gap:7px;
}

.field label{
  font-size:13px;
  font-weight:650;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--border);
  border-radius:13px;
  background:#fafafa;
  padding:12px 13px;
  outline:none;
}

.field input,
.field select{
  height:45px;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.two-columns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
}

.media-options{
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  background:#fafafa;
}

.media-options-title{
  font-size:13px;
  font-weight:650;
  margin-bottom:10px;
}

.file-row{
  display:flex;
  align-items:center;
  gap:10px;
}

.file-input{
  display:none;
}

.choose-file{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:0 14px;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

.file-name{
  color:var(--muted);
  font-size:12px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.media-preview{
  display:none;
  margin-top:12px;
  border-radius:13px;
  overflow:hidden;
  background:#eee;
  max-height:230px;
}

.media-preview.active{
  display:block;
}

.media-preview img,
.media-preview video{
  display:block;
  width:100%;
  max-height:230px;
  object-fit:contain;
}

.upload-status{
  display:none;
  margin-top:9px;
  font-size:12px;
  color:var(--muted);
  line-height:1.4;
}

.upload-status.active{
  display:block;
}

.upload-status.success{
  color:#246331;
}

.upload-status.error{
  color:#b42318;
}

.form-footer{
  display:flex;
  justify-content:flex-end;
  gap:10px;
  padding-top:5px;
}

.secondary-button,
.primary-button{
  min-height:44px;
  padding:0 17px;
  border-radius:13px;
  border:1px solid var(--border);
  font-weight:600;
}

.secondary-button{
  background:#eee;
}

.primary-button{
  background:#111;
  color:#fff;
  border-color:#111;
}

.primary-button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.delete-box{
  width:min(430px,100%);
  padding:25px;
  border-radius:22px;
  background:white;
  box-shadow:0 30px 100px rgba(0,0,0,.2);
}

.delete-box p{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
  margin:10px 0 22px;
}

.delete-actions{
  display:flex;
  justify-content:flex-end;
  gap:9px;
}

.danger-button{
  min-height:42px;
  padding:0 15px;
  border:0;
  border-radius:12px;
  background:var(--danger);
  color:white;
  font-weight:600;
}

.toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  padding:12px 17px;
  border-radius:12px;
  background:#111;
  color:white;
  font-size:13px;
  z-index:2000;
  transition:.25s;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

.toast.error{
  background:#b42318;
}

@media(max-width:760px){

  .app{
    width:calc(100% - 24px);
    padding-top:24px;
  }

  .header{
    align-items:flex-start;
  }

  .toolbar{
    flex-direction:column;
  }

  .search{
    max-width:none;
  }

  .filter{
    width:100%;
  }

  .post-card{
    grid-template-columns:78px 1fr;
    gap:13px;
  }

  .post-media{
    width:78px;
    height:70px;
  }

  .post-actions{
    grid-column:2;
  }

  .action-button{
    flex:1;
  }

  .two-columns{
    grid-template-columns:1fr;
  }

  .form{
    padding:18px;
  }
}

@media(max-width:480px){

  .header{
    flex-direction:column;
  }

  .new-post-button{
    width:100%;
  }

}

</style>
</head>

<body>

<main class="app">

<header class="header">

  <div class="brand">

    <h1>Post Admin</h1>

    <p>
      Manage your website posts.
    </p>

  </div>

  <button
    class="new-post-button"
    id="newPostButton"
    type="button">

    + New Post

  </button>

</header>


<section class="toolbar">

  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="Search by title or slug...">

  </div>

  <select
    id="statusFilter"
    class="filter">

    <option value="all">
      All posts
    </option>

    <option value="published">
      Published
    </option>

    <option value="draft">
      Drafts
    </option>

  </select>

</section>


<section
  id="postsContainer"
  class="posts">

  <div class="state">

    <strong>
      Loading posts...
    </strong>

    <p>
      Connecting to the backend.
    </p>

  </div>

</section>

</main>


<!-- =====================================================
     POST MODAL
     ===================================================== -->

<div
  id="postModal"
  class="modal-backdrop">

  <div class="modal">

    <div class="modal-header">

      <h2 id="modalTitle">
        New Post
      </h2>

      <button
        class="close-button"
        id="closeModal"
        type="button">

        ×

      </button>

    </div>


    <form
      id="postForm"
      class="form">

      <input
        id="postId"
        type="hidden">


      <div class="field">

        <label>
          Title
        </label>

        <input
          id="title"
          type="text"
          placeholder="Post title"
          required>

      </div>


      <div class="field">

        <label>
          Caption / Excerpt
        </label>

        <input
          id="caption"
          type="text"
          placeholder="Short description">

      </div>


      <div class="field">

        <label>
          Content
        </label>

        <textarea
          id="content"
          placeholder="Write your post content here..."></textarea>

      </div>


      <div class="two-columns">

        <div class="field">

          <label>
            Status
          </label>

          <select id="status">

            <option value="draft">
              Draft
            </option>

            <option value="published">
              Published
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            Post date
          </label>

          <input
            id="postDate"
            type="datetime-local">

        </div>

      </div>


      <!-- IMAGE -->

      <div class="media-options">

        <div class="media-options-title">
          Image
        </div>


        <div class="file-row">

          <label class="choose-file">

            Choose Image

            <input
              id="imageFile"
              class="file-input"
              type="file"
              accept="image/*">

          </label>


          <span
            id="imageFileName"
            class="file-name">

            No file selected

          </span>

        </div>


        <div
          id="imageUploadStatus"
          class="upload-status">
        </div>


        <div
          id="imagePreview"
          class="media-preview">

          <img
            id="imagePreviewImg"
            alt="Image preview">

        </div>


        <div
          class="field"
          style="margin-top:12px">

          <label>
            Or use an image URL
          </label>

          <input
            id="imageUrl"
            type="url"
            placeholder="https://...">

        </div>

      </div>


      <!-- VIDEO -->

      <div class="media-options">

        <div class="media-options-title">
          Video
        </div>


        <div class="file-row">

          <label class="choose-file">

            Choose Video

            <input
              id="videoFile"
              class="file-input"
              type="file"
              accept="video/*">

          </label>


          <span
            id="videoFileName"
            class="file-name">

            No file selected

          </span>

        </div>


        <div
          id="videoUploadStatus"
          class="upload-status">
        </div>


        <div
          id="videoPreview"
          class="media-preview">

          <video
            id="videoPreviewVideo"
            controls
            playsinline>
          </video>

        </div>


        <div
          class="field"
          style="margin-top:12px">

          <label>
            Or use a video URL
          </label>

          <input
            id="videoUrl"
            type="url"
            placeholder="https://...">

        </div>

      </div>


      <div class="field">

        <label>
          Slug
        </label>

        <input
          id="slug"
          type="text"
          placeholder="my-post-title">

      </div>


      <div class="form-footer">

        <button
          type="button"
          class="secondary-button"
          id="cancelButton">

          Cancel

        </button>


        <button
          type="submit"
          class="primary-button"
          id="saveButton">

          Save Post

        </button>

      </div>

    </form>

  </div>

</div>


<!-- DELETE -->

<div
  id="deleteModal"
  class="modal-backdrop">

  <div class="delete-box">

    <h2>
      Delete post?
    </h2>

    <p>
      This will permanently remove the post
      from the Google Sheet.
    </p>

    <div class="delete-actions">

      <button
        class="secondary-button"
        id="cancelDelete"
        type="button">

        Cancel

      </button>


      <button
        class="danger-button"
        id="confirmDelete"
        type="button">

        Delete

      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast">
</div>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzDkN67TjrkS1AnL-17PJtbIahL3U_EiOli7BOfevFNB_bcNKKvA_XNRMSS47pbw69Uzg/exec";


let posts = [];
let postToDelete = null;


/* =========================================================
   ELEMENTS
   ========================================================= */

const postsContainer =
  document.getElementById(
    "postsContainer"
  );

const postModal =
  document.getElementById(
    "postModal"
  );

const deleteModal =
  document.getElementById(
    "deleteModal"
  );

const postForm =
  document.getElementById(
    "postForm"
  );

const saveButton =
  document.getElementById(
    "saveButton"
  );

const toast =
  document.getElementById(
    "toast"
  );


/* =========================================================
   LOAD POSTS — JSONP
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  loadPosts
);


function loadPosts(){

  postsContainer.innerHTML = `
    <div class="state">
      <strong>Loading posts...</strong>
      <p>Connecting to the backend.</p>
    </div>
  `;


  const callbackName =
    "liamList_" +
    Date.now() +
    "_" +
    Math.floor(
      Math.random() * 100000
    );


  window[callbackName] =
    function(data){

      cleanupJsonp(
        script,
        callbackName
      );


      try{

        if(
          !data ||
          data.success !== true
        ){

          throw new Error(
            data &&
            data.error
              ? data.error
              : "Failed to load posts."
          );
        }


        posts =
          Array.isArray(
            data.posts
          )
            ? data.posts
            : [];


        renderPosts();

      }catch(error){

        console.error(error);

        postsContainer.innerHTML = `
          <div class="state">
            <strong>Could not load posts</strong>
            <p>${escapeHtml(error.message)}</p>
          </div>
        `;
      }
    };


  const script =
    document.createElement(
      "script"
    );


  script.src =
    API_URL +
    "?action=list" +
    "&callback=" +
    encodeURIComponent(
      callbackName
    ) +
    "&t=" +
    Date.now();


  script.onerror =
    function(){

      cleanupJsonp(
        script,
        callbackName
      );


      postsContainer.innerHTML = `
        <div class="state">
          <strong>Could not load posts</strong>
          <p>Could not connect to the backend.</p>
        </div>
      `;
    };


  document
    .body
    .appendChild(script);
}


/* =========================================================
   JSONP CLEANUP
   ========================================================= */

function cleanupJsonp(
  script,
  callbackName
){

  if(script){

    script.remove();
  }

  try{

    delete window[
      callbackName
    ];

  }catch(error){

    window[
      callbackName
    ] = undefined;
  }
}


/* =========================================================
   RENDER
   ========================================================= */

function renderPosts(){

  const search =
    document
      .getElementById(
        "searchInput"
      )
      .value
      .trim()
      .toLowerCase();


  const filter =
    document
      .getElementById(
        "statusFilter"
      )
      .value;


  const filtered =
    posts.filter(
      function(post){

        const title =
          String(
            post.title || ""
          ).toLowerCase();


        const slug =
          String(
            post.slug || ""
          ).toLowerCase();


        const status =
          String(
            post.status || "draft"
          ).toLowerCase();


        return (

          (
            !search ||
            title.includes(search) ||
            slug.includes(search)
          )

          &&

          (
            filter === "all" ||
            status === filter
          )

        );
      }
    );


  if(!filtered.length){

    postsContainer.innerHTML = `

      <div class="state">

        <strong>
          ${
            posts.length
              ? "No matching posts"
              : "No posts yet"
          }
        </strong>

        <p>
          ${
            posts.length
              ? "Try another search or filter."
              : "Create your first post."
          }
        </p>

      </div>

    `;

    return;
  }


  postsContainer.innerHTML =
    filtered
      .map(
        createPostCard
      )
      .join("");
}


/* =========================================================
   CARD
   ========================================================= */

function createPostCard(
  post
){

  let media = `
    <div class="no-media">
      No media
    </div>
  `;


  if(post.image_url){

    media = `
      <img
        src="${escapeAttribute(post.image_url)}"
        alt=""
        loading="lazy">
    `;

  }else if(post.video_url){

    media = `
      <video
        src="${escapeAttribute(post.video_url)}"
        muted
        preload="metadata">
      </video>
    `;
  }


  const status =
    String(
      post.status || "draft"
    ).toLowerCase();


  return `

    <article class="post-card">

      <div class="post-media">
        ${media}
      </div>


      <div class="post-info">

        <div class="post-title">
          ${escapeHtml(
            post.title ||
            "Untitled"
          )}
        </div>


        <div class="post-caption">
          ${escapeHtml(
            post.caption ||
            "No caption"
          )}
        </div>


        <div class="post-meta">

          <span class="status ${status}">
            ${escapeHtml(status)}
          </span>

          <span>
            ${formatDate(
              post.post_date
            )}
          </span>

        </div>

      </div>


      <div class="post-actions">

        <button
          class="action-button"
          type="button"
          onclick="editPost('${escapeAttribute(post.id)}')">

          Edit

        </button>


        <button
          class="action-button delete"
          type="button"
          onclick="askDelete('${escapeAttribute(post.id)}')">

          Delete

        </button>

      </div>

    </article>

  `;
}


/* =========================================================
   NEW POST
   ========================================================= */

document
  .getElementById(
    "newPostButton"
  )
  .addEventListener(
    "click",
    function(){

      resetForm();


      document
        .getElementById(
          "modalTitle"
        )
        .textContent =
        "New Post";


      postModal
        .classList
        .add("active");
    }
  );


/* =========================================================
   EDIT
   ========================================================= */

window.editPost =
function(id){

  const post =
    posts.find(
      function(p){

        return String(p.id) ===
          String(id);
      }
    );


  if(!post){

    return;
  }


  document
    .getElementById(
      "postId"
    )
    .value =
    post.id || "";


  document
    .getElementById(
      "title"
    )
    .value =
    post.title || "";


  document
    .getElementById(
      "caption"
    )
    .value =
    post.caption || "";


  document
    .getElementById(
      "content"
    )
    .value =
    post.content || "";


  document
    .getElementById(
      "imageUrl"
    )
    .value =
    post.image_url || "";


  document
    .getElementById(
      "videoUrl"
    )
    .value =
    post.video_url || "";


  document
    .getElementById(
      "status"
    )
    .value =
    post.status || "draft";


  document
    .getElementById(
      "slug"
    )
    .value =
    post.slug || "";


  document
    .getElementById(
      "postDate"
    )
    .value =
    toDateTimeLocal(
      post.post_date
    );


  document
    .getElementById(
      "modalTitle"
    )
    .textContent =
    "Edit Post";


  clearSelectedFiles();


  /*
   * Show existing image.
   */

  if(post.image_url){

    const preview =
      document.getElementById(
        "imagePreview"
      );

    const image =

    }


    const payload = {

      action:

          : "create",

      id:

      title:
        title,

      caption:

          .getElementById(
            "caption"

/* =========================================================
   OLD PROJECT STYLE POST
   ========================================================= */

function sendPost(
  data
){

  return new Promise(
    function(resolve){

      /*
       * IMPORTANT:
       *
       * no-cors means the browser
       * intentionally does NOT read
       * Apps Script's response.
       *
       * Apps Script still receives
       * and executes the request.
       */

      const body =
        new URLSearchParams();


      Object.keys(data)
        .forEach(
          function(key){

            if(
              data[key] !== undefined &&
              data[key] !== null
            ){

              body.append(
                key,
                String(data[key])
              );
            }
          }
        );


      fetch(
        API_URL,
        {
          method:"POST",
          mode:"no-cors",
          body:body
        }
      )
        .then(
          function(){

            resolve();
          }
        )
        .catch(
          function(){

            /*
             * no-cors requests can sometimes
             * report network errors even when
             * Apps Script received the request.
             *
             * Resolve anyway; list() below
             * confirms the actual Sheet state.
             */

            resolve();
          }
        );

    }
  );
}


/* =========================================================
   FILE UPLOAD
   ========================================================= */

function uploadFile(
  file,
  statusId
){

  const status =
    document.getElementById(
      statusId
    );


  if(
    !file.type.startsWith(
      "image/"
    ) &&
    !file.type.startsWith(
      "video/"
    )
  ){

    return Promise.reject(
      new Error(
        "Only images and videos are allowed."
      )
    );
  }


  status.classList.add(
    "active"
  );

  status.classList.remove(
    "success",
    "error"
  );


  status.textContent =
    "Reading " +
    file.name +
    "...";


  return fileToBase64(
    file
  )
    .then(
      function(base64){

        status.textContent =
          "Uploading " +
          file.name +
          "...";


        return uploadBase64(
          file,
          base64,
          status
        );
      }
    )
    .catch(
      function(error){

        status.classList.add(
          "error"
        );

        status.textContent =
          error.message ||
          "Upload failed.";


        throw error;
      }
    );
}


/* =========================================================
   FILE → BASE64
   ========================================================= */

function fileToBase64(
  file
){

  return new Promise(
    function(resolve,reject){

      const reader =
        new FileReader();


      reader.onload =
        function(){

          try{

            const result =
              String(
                reader.result
              );


            const comma =
              result.indexOf(",");


            if(
              comma === -1
            ){

              reject(
                new Error(
                  "Could not read the selected file."
                )
              );

              return;
            }


            const base64 =
              result.substring(
                comma + 1
              );


            if(!base64){

              reject(
                new Error(
                  "The selected file is empty."
                )
              );

              return;
            }


            resolve(
              base64
            );

          }catch(error){

            reject(error);
          }
        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Failed to read " +
              file.name +
              "."
            )
          );
        };


      reader.readAsDataURL(
        file
      );

    }
  );
}


/* =========================================================
   BASE64 → APPS SCRIPT
   ========================================================= */

function uploadBase64(
  file,
  base64,
  status
){

  return new Promise(
    function(resolve,reject){

      const uploadId =
        (
          window.crypto &&
          crypto.randomUUID
        )
          ? crypto.randomUUID()
          : (
              "upload-" +
              Date.now() +
              "-" +
              Math.random()
                .toString(36)
                .slice(2)
            );


      const body =
        new URLSearchParams();


      /*
       * THESE NAMES MATCH THE OLD
       * WORKING PROJECT.
       */

      body.append(
        "action",
        "uploadImage"
      );

      body.append(
        "uploadId",
        uploadId
      );

      body.append(
        "filename",
        file.name
      );

      body.append(
        "mimeType",
        file.type ||
        "application/octet-stream"
      );

      body.append(
        "data",
        base64
      );


      status.textContent =
        "Sending " +
        file.name +
        "...";


      /*
       * Fire-and-forget POST.
       * We do NOT read its response.
       */

      fetch(
        API_URL,
        {
          method:"POST",
          mode:"no-cors",
          body:body
        }
      )
        .catch(
          function(error){

            console.warn(
              "Upload POST warning:",
              error
            );
          }
        );


      status.textContent =
        "Waiting for Google Drive...";


      pollUploadStatus(
        uploadId,
        status,
        180000
      )
        .then(
          function(result){

            if(
              !result ||
              result.success !== true
            ){

              throw new Error(
                result &&
                result.error
                  ? result.error
                  : "Upload failed."
              );
            }


            const url =
              result.url ||
              result.mediaUrl ||
              (
                result.file &&
                (
                  result.file.url ||
                  result.file.mediaUrl
                )
              );


            if(!url){

              throw new Error(
                "Upload succeeded but Google Drive did not return a media URL."
              );
            }


            status.classList.add(
              "success"
            );


            status.textContent =
              "Uploaded successfully.";


            resolve(url);

          }
        )
        .catch(
          function(error){

            status.classList.add(
              "error"
            );

            status.textContent =
              error.message ||
              "Upload failed.";


            reject(error);
          }
        );

    }
  );
}


/* =========================================================
   POLL UPLOAD STATUS — JSONP
   ========================================================= */

function pollUploadStatus(
  uploadId,
  status,
  timeoutMs
){

  return new Promise(
    function(resolve,reject){

      const started =
        Date.now();


      function check(){

        if(
          Date.now() -
          started >
          timeoutMs
        ){

          reject(
            new Error(
              "Upload is taking too long. The file may not have been processed by Google Drive."
            )
          );

          return;
        }


        status.textContent =
          "Waiting for Google Drive...";


        const callbackName =
          "liamUpload_" +
          Date.now() +
          "_" +
          Math.floor(
            Math.random() *
            100000
          );


        let finished =
          false;


        const script =
          document.createElement(
            "script"
          );


        const cleanup =
          function(){

            if(finished){
              return;
            }

            finished = true;

            cleanupJsonp(
              script,
              callbackName
            );
          };


        window[callbackName] =
          function(result){

            cleanup();


            if(
              result &&
              result.pending
            ){

              setTimeout(
                check,
                1200
              );

              return;
            }


            if(
              result &&
              result.success === true
            ){

              resolve(result);

              return;
            }


            reject(
              new Error(
                result &&
                result.error
                  ? result.error
                  : "Upload failed."
              )
            );
          };


        script.src =
          API_URL +
          "?action=uploadstatus" +
          "&uploadid=" +
          encodeURIComponent(
            uploadId
          ) +
          "&callback=" +
          encodeURIComponent(
            callbackName
          ) +
          "&t=" +
          Date.now();


        script.onerror =
          function(){

            cleanup();

            setTimeout(
              check,
              1800
            );
          };


        document
          .body
          .appendChild(
            script
          );
      }


      check();

    }
  );
}

/* =========================================================
   SLUG
   ========================================================= */

function createSlug(
  title
){

  return String(
    title || ""
  )
    .toLowerCase()
    .trim()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .replace(
      /[^a-z0-9\s-]/g,
      ""
    )
    .replace(
      /\s+/g,
      "-"
    )
    .replace(
      /-+/g,
      "-"
    )
    .replace(
      /^-|-$/g,
      ""
    );
}


/* =========================================================
   DATE
   ========================================================= */

function getCurrentDateTimeLocal(){

  const now =
    new Date();


  const offset =
    now.getTimezoneOffset();


  const local =
    new Date(
      now.getTime() -
      offset * 60000
    );


  return local
    .toISOString()
    .slice(0,16);
}


function toDateTimeLocal(
  value
){

  if(!value){

    return "";
  }


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    if(
      typeof value === "string" &&
      value.length >= 16
    ){

      return value.slice(
        0,
        16
      );
    }


    return "";
  }


  const offset =
    date.getTimezoneOffset();


  const local =
    new Date(
      date.getTime() -
      offset * 60000
    );


  return local
    .toISOString()
    .slice(0,16);
}


function formatDate(
  value
){

  if(!value){

    return "No date";
  }


  const date =
    new Date(value);


  if(
    isNaN(
      date.getTime()
    )
  ){

    return String(value);
  }


  return new Intl.DateTimeFormat(
    undefined,
    {
      year:"numeric",
      month:"short",
      day:"numeric"
    }
  ).format(date);
}


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer;


function showToast(
  message,
  error=false
){

  clearTimeout(
    toastTimer
  );


  toast.textContent =
    message;


  toast.classList.toggle(
    "error",
    error
  );


  toast.classList.add(
    "show"
  );


  toastTimer =
    setTimeout(
      function(){

        toast.classList.remove(
          "show"
        );

      },
      3500
    );
}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(
  value
){

  return String(
    value
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


function escapeAttribute(
  value
){

  return escapeHtml(
    value
  );
}
