<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Adrian Kreidehüter — Messages</title>

<!-- ================================================== -->
<!-- CSS                                                 -->
<!-- ================================================== -->
<style>
  :root{
    --glass-bg: rgba(255, 255, 255, 0.14);
    --glass-border: rgba(255, 255, 255, 0.35);
    --text-primary: #f5f8ff;
    --text-secondary: rgba(245, 248, 255, 0.72);
    --shadow-soft: 0 8px 32px rgba(5, 8, 20, 0.35);
    --radius-xl: 28px;
    --radius-lg: 22px;
    --radius-pill: 999px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    min-height: 100vh;
    position: relative;
  }

  /* ---------------------------------------------------- */
  /* Background layers                                    */
  /* ---------------------------------------------------- */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: -3;
    background-image: url("background.jpg");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    background-repeat: no-repeat;
    filter: blur(2px) saturate(1.05);
    transform: scale(1.03);
  }

  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: -2;
    background:
      linear-gradient(180deg, rgba(6, 10, 24, 0.35) 0%, rgba(6, 10, 24, 0.15) 30%, rgba(4, 8, 20, 0.55) 100%);
  }

  .bg-vignette {
    position: fixed;
    inset: 0;
    z-index: -1;
    background: radial-gradient(120% 90% at 50% 10%, transparent 40%, rgba(2, 5, 14, 0.45) 100%);
    pointer-events: none;
  }

  /* ---------------------------------------------------- */
  /* Page layout                                           */
  /* ---------------------------------------------------- */
  .page {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 20px 70px;
  }

  .feed {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 52px;
  }

  .feed-header {
    text-align: center;
    margin-bottom: 4px;
  }

  .feed-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
    text-shadow: 0 2px 12px rgba(0,0,0,0.3);
  }

  .feed-subtitle {
    margin-top: 4px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* ---------------------------------------------------- */
  /* Glass base                                             */
  /* ---------------------------------------------------- */
  .glass {
    position: relative;
    background: var(--glass-bg);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    backdrop-filter: blur(22px) saturate(140%);
    border: 1px solid var(--glass-border);
    box-shadow:
      var(--shadow-soft),
      inset 0 1px 0 rgba(255, 255, 255, 0.35),
      inset 0 -1px 0 rgba(0, 0, 0, 0.08);
    overflow: hidden;
  }

  .glass::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 45%;
    background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0) 100%);
    pointer-events: none;
  }

  /* ---------------------------------------------------- */
  /* Message group                                          */
  /* ---------------------------------------------------- */
  .message-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .message-group.entering {
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(16px);
      filter: blur(4px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
  }

  /* Sender card */
  .sender-card {
    align-self: flex-start;
    max-width: 88%;
    padding: 12px 20px;
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sender-label {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-secondary);
    letter-spacing: 0.02em;
  }

  .sender-name {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
    word-break: break-word;
  }

  /* Message card */
  .message-card {
    padding: 24px 24px 26px;
    border-radius: var(--radius-xl);
  }

  .message-text {
    font-size: 17px;
    line-height: 1.55;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    text-shadow: 0 1px 8px rgba(0,0,0,0.2);
  }

  .message-time {
    margin-top: 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  /* ---------------------------------------------------- */
  /* State cards (loading / empty / error)                  */
  /* ---------------------------------------------------- */
  .state-card {
    padding: 26px 24px;
    border-radius: var(--radius-xl);
    text-align: center;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
  }

  .state-card.error-banner {
    padding: 14px 20px;
    font-size: 13px;
    color: #ffcaca;
  }

  .dots span {
    display: inline-block;
    width: 6px;
    height: 6px;
    margin: 0 2px;
    border-radius: 50%;
    background: var(--text-secondary);
    animation: pulseDot 1.2s infinite ease-in-out;
  }
  .dots span:nth-child(2) { animation-delay: 0.15s; }
  .dots span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes pulseDot {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.85); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* ---------------------------------------------------- */
  /* Responsive tweaks                                      */
  /* ---------------------------------------------------- */
  @media (max-width: 400px) {
    .page { padding: 28px 14px 60px; }
    .feed { gap: 42px; }
    .message-card { padding: 20px 18px 22px; }
    .message-text { font-size: 16px; }
    .sender-card { padding: 10px 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<!-- ================================================== -->
<!-- HTML STRUCTURE                                      -->
<!-- ================================================== -->

<div class="bg-layer"></div>
<div class="bg-overlay"></div>
<div class="bg-vignette"></div>

<div class="page">
  <div class="feed">

    <div class="feed-header">
      <div class="feed-title">Messages for Adrian</div>
      <div class="feed-subtitle" id="errorBanner"></div>
    </div>

    <div id="feedList">
      <!-- Initial loading state -->
      <div class="glass state-card" id="loadingState">
        Loading messages<span class="dots"><span>.</span><span>.</span><span>.</span></span>
      </div>
    </div>

  </div>
</div>

<!-- ================================================== -->
<!-- JAVASCRIPT                                          -->
<!-- ================================================== -->
<script>
(function () {
  "use strict";

  /* -------------------------------------------------- */
  /* API configuration                                  */
  /* -------------------------------------------------- */
  const API_URL = "https://script.google.com/macros/s/AKfycbxP2zrsxB1TyIfXpH-PdgaR3huJgpoQuYkjmMDQWl99ZI_3VErsrpVygnMZ6lf1gpDa1Q/exec";
  const POLL_INTERVAL_MS = 12000;

  /* -------------------------------------------------- */
  /* Element references                                 */
  /* -------------------------------------------------- */
  const feedList = document.getElementById("feedList");
  const errorBanner = document.getElementById("errorBanner");

  /* -------------------------------------------------- */
  /* State                                                */
  /* -------------------------------------------------- */
  let hasLoadedOnce = false;
  let renderedSignature = null; // to avoid unnecessary re-renders

  /* -------------------------------------------------- */
  /* Helpers                                              */
  /* -------------------------------------------------- */
  function resolveDisplayName(item) {
    if (item.anonymous === true) return "Anonymous";
    const name = (item.name || "").toString().trim();
    return name.length > 0 ? name : "Anonymous";
  }

  function resolveMessageText(item) {
    return (item.message !== undefined && item.message !== null)
      ? item.message.toString()
      : "";
  }

  function resolveTimestamp(item) {
    if (!item.timestamp) return null;
    const d = new Date(item.timestamp);
    return isNaN(d.getTime()) ? null : d;
  }

  function formatTimestamp(date) {
    if (!date) return "";
    return date.toLocaleString(undefined, {
      month: "short",
      day: "numeric",
      hour: "numeric",
      minute: "2-digit"
    });
  }

  function extractMessagesArray(data) {
    if (Array.isArray(data)) return data;
    if (data && Array.isArray(data.messages)) return data.messages;
    return [];
  }

  function sortNewestFirst(items) {
    const withDates = items.map((item, idx) => ({
      item,
      idx,
      date: resolveTimestamp(item)
    }));

    const anyDates = withDates.some(entry => entry.date !== null);
    if (!anyDates) {
      // no usable timestamps; preserve given order (assume API already newest-first)
      return items;
    }

    withDates.sort((a, b) => {
      const at = a.date ? a.date.getTime() : -Infinity;
      const bt = b.date ? b.date.getTime() : -Infinity;
      if (bt !== at) return bt - at;
      return a.idx - b.idx;
    });

    return withDates.map(entry => entry.item);
  }

  function buildSignature(items) {
    // Cheap signature to detect whether content actually changed
    return items.map(item =>
      resolveDisplayName(item) + "|" + resolveMessageText(item) + "|" + (item.timestamp || "")
    ).join("§");
  }

  /* -------------------------------------------------- */
  /* Rendering (safe — no innerHTML for user data)         */
  /* -------------------------------------------------- */
  function createMessageGroup(item, animate) {
    const group = document.createElement("div");
    group.className = "message-group" + (animate ? " entering" : "");

    // Sender card
    const senderCard = document.createElement("div");
    senderCard.className = "glass sender-card";

    const senderLabel = document.createElement("div");
    senderLabel.className = "sender-label";
    senderLabel.textContent = "From:";

    const senderName = document.createElement("div");
    senderName.className = "sender-name";
    senderName.textContent = resolveDisplayName(item);

    senderCard.appendChild(senderLabel);
    senderCard.appendChild(senderName);

    // Message card
    const messageCard = document.createElement("div");
    messageCard.className = "glass message-card";

    const messageText = document.createElement("div");
    messageText.className = "message-text";
    messageText.textContent = resolveMessageText(item);
    messageCard.appendChild(messageText);

    const ts = resolveTimestamp(item);
    if (ts) {
      const timeEl = document.createElement("div");
      timeEl.className = "message-time";
      timeEl.textContent = formatTimestamp(ts);
      messageCard.appendChild(timeEl);
    }

    group.appendChild(senderCard);
    group.appendChild(messageCard);

    return group;
  }

  function renderStateCard(text) {
    feedList.innerHTML = "";
    const card = document.createElement("div");
    card.className = "glass state-card";
    card.textContent = text;
    feedList.appendChild(card);
  }

  function renderMessages(items) {
    feedList.innerHTML = "";

    if (items.length === 0) {
      renderStateCard("No messages yet.");
      return;
    }

    const fragment = document.createDocumentFragment();
    items.forEach(item => {
      fragment.appendChild(createMessageGroup(item, !hasLoadedOnce ? true : true));
    });
    feedList.appendChild(fragment);
  }

  function setErrorBanner(text) {
    errorBanner.textContent = text || "";
    errorBanner.classList.toggle("error-banner", !!text);
  }

  /* -------------------------------------------------- */
  /* Loading messages                                     */
  /* -------------------------------------------------- */
  async function loadMessages() {
    try {
      const response = await fetch(API_URL);
      if (!response.ok) throw new Error("Bad response");

      const data = await response.json();
      const items = sortNewestFirst(extractMessagesArray(data));

      const signature = buildSignature(items);

      if (signature !== renderedSignature) {
        renderedSignature = signature;
        renderMessages(items);
      }

      setErrorBanner("");
      hasLoadedOnce = true;
    } catch (err) {
      if (!hasLoadedOnce) {
        renderStateCard("Unable to refresh messages.");
      } else {
        // keep previously loaded messages, just flag the issue
        setErrorBanner("Unable to refresh messages.");
      }
    }
  }

  /* -------------------------------------------------- */
  /* Init + polling                                       */
  /* -------------------------------------------------- */
  loadMessages();
  setInterval(loadMessages, POLL_INTERVAL_MS);

})();
</script>

</body>
</html>
