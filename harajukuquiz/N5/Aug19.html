<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Quiz Bahasa Jepang N5</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    color: #171717;
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 560px;
    background: white;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
}

.hidden {
    display: none !important;
}

.fade-in {
    animation: fadeIn 0.4s ease;
}

.fade-out {
    animation: fadeOut 0.35s ease forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

h1 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #777;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #171717;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #171717;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.progress {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 14px;
}

.kanji {
    text-align: center;
    font-size: 64px;
    margin: 35px 0;
}

.instruction {
    text-align: center;
    color: #777;
    margin-bottom: 18px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    padding: 17px;
    border: 2px solid #ddd;
    border-radius: 14px;
    cursor: pointer;
    background: white;
    transition: 0.15s;
}

.option.selected {
    border-color: #171717;
    background: #f0f0f0;
}

.option.correct {
    border-color: #222;
    background: #e8f5e9;
}

.option.wrong {
    border-color: #777;
    background: #f5f5f5;
}

.result {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
    min-height: 30px;
}

.retry-info {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 10px;
}

.stats {
    text-align: center;
    margin: 25px 0;
}

.stat {
    margin: 12px 0;
    font-size: 18px;
}

.review-item {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 16px;
    margin-top: 12px;
}

.review-kanji {
    font-size: 28px;
    font-weight: bold;
}

.review-status {
    margin-top: 8px;
    font-weight: bold;
}

.small {
    text-align: center;
    color: #777;
    font-size: 14px;
}

.error {
    text-align: center;
    color: #b00020;
    margin-top: 12px;
}

.loading {
    text-align: center;
    color: #777;
    padding: 20px 0;
}

</style>
</head>

<body>


<!-- ==================================================
     PAGE 1 — NAMA
================================================== -->

<section
    id="namePage"
    class="page">

    <div class="card">

        <h1>
            Quiz Bahasa Jepang(N5)
        </h1>

        <p class="subtitle">
            Masukkan nama untuk memulai
        </p>

        <input
            id="nameInput"
            type="text"
            placeholder="Nama kamu"
            autocomplete="name"
        >

        <button
            id="startButton">

            MULAI

        </button>

        <p
            id="nameError"
            class="error">
        </p>

    </div>

</section>


<!-- ==================================================
     PAGE 2 — QUIZ
================================================== -->

<section
    id="quizPage"
    class="page hidden">

    <div class="card">

        <div class="progress">

            <span id="progressText">
                Memuat...
            </span>

            <span id="masteryText">
                0 / 0
            </span>

        </div>


        <div
            id="kanji"
            class="kanji">

            Memuat soal...

        </div>


        <div
            id="loadingMessage"
            class="loading">

            Mengambil pertanyaan...

        </div>


        <div
            id="instruction"
            class="instruction hidden">

            Pilih maksimal 2 jawaban

        </div>


        <div
            id="options"
            class="options">
        </div>


        <button
            id="answerButton"
            disabled>

            JAWAB

        </button>


        <div
            id="result"
            class="result">
        </div>


        <div
            id="retryInfo"
            class="retry-info">
        </div>

    </div>

</section>


<!-- ==================================================
     PAGE 3 — HASIL
================================================== -->

<section
    id="resultPage"
    class="page hidden">

    <div class="card">

        <h1>
            Quiz Selesai
        </h1>


        <p
            id="resultName"
            class="subtitle">
        </p>


        <div class="stats">

            <div class="stat">

                <strong
                    id="totalResult">
                    0
                </strong>

                Pertanyaan

            </div>


            <div class="stat">

                ✓

                <strong
                    id="correctResult">
                    0
                </strong>

                Benar

            </div>


            <div class="stat">

                ✓

                <strong
                    id="partialResult">
                    0
                </strong>

                Sebagian benar

            </div>


            <div class="stat">

                ×

                <strong
                    id="wrongResult">
                    0
                </strong>

                Salah

            </div>

        </div>


        <p
            id="saveStatus"
            class="small">

            Menyimpan hasil...

        </p>


        <button
            id="reviewButton">

            LIHAT REVIEW

        </button>

    </div>

</section>


<!-- ==================================================
     PAGE 4 — REVIEW
================================================== -->

<section
    id="reviewPage"
    class="page hidden">

    <div class="card">

        <h1>
            Review
        </h1>


        <div
            id="reviewList">
        </div>


        <button
            id="backResultButton">

            KEMBALI KE HASIL

        </button>

    </div>

</section>


<script>


/* ==================================================
   API GOOGLE APPS SCRIPT
================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzwwzXuR4RyVsYotVtvrj8azxZyfmNyIwxngTkH6SEAJl7P8_Y4HKKHRFuPLT4JMSWCTQ/exec";


/* ==================================================
   DATA QUIZ
================================================== */

let playerName = "";

let questions = [];

let currentQuestion = null;

let selectedOptions = [];

let attemptNumber = 0;

let completedQuestions = new Set();

let latestResults = {};

let retryQueue = [];

let retryCounters = {};


/* ==================================================
   ELEMENT
================================================== */

const namePage =
document.getElementById(
    "namePage"
);

const quizPage =
document.getElementById(
    "quizPage"
);

const resultPage =
document.getElementById(
    "resultPage"
);

const reviewPage =
document.getElementById(
    "reviewPage"
);

const nameInput =
document.getElementById(
    "nameInput"
);

const startButton =
document.getElementById(
    "startButton"
);

const nameError =
document.getElementById(
    "nameError"
);

const progressText =
document.getElementById(
    "progressText"
);

const masteryText =
document.getElementById(
    "masteryText"
);

const kanji =
document.getElementById(
    "kanji"
);

const loadingMessage =
document.getElementById(
    "loadingMessage"
);

const instruction =
document.getElementById(
    "instruction"
);

const options =
document.getElementById(
    "options"
);

const answerButton =
document.getElementById(
    "answerButton"
);

const result =
document.getElementById(
    "result"
);

const retryInfo =
document.getElementById(
    "retryInfo"
);

const resultName =
document.getElementById(
    "resultName"
);

const totalResult =
document.getElementById(
    "totalResult"
);

const correctResult =
document.getElementById(
    "correctResult"
);

const partialResult =
document.getElementById(
    "partialResult"
);

const wrongResult =
document.getElementById(
    "wrongResult"
);

const saveStatus =
document.getElementById(
    "saveStatus"
);

const reviewButton =
document.getElementById(
    "reviewButton"
);

const reviewList =
document.getElementById(
    "reviewList"
);

const backResultButton =
document.getElementById(
    "backResultButton"
);


/* ==================================================
   TOMBOL MULAI
================================================== */

startButton.addEventListener(
    "click",
    startQuiz
);


async function startQuiz() {

    playerName =
        nameInput.value.trim();


    if (!playerName) {

        nameError.textContent =
            "Masukkan nama terlebih dahulu.";

        return;
    }


    nameError.textContent = "";


    startButton.disabled =
        true;


    startButton.textContent =
        "MEMUAT...";


    /*
       LANGSUNG pindah ke halaman quiz.

       Kita tidak menunggu API
       terlebih dahulu.
    */

    namePage.classList.add(
        "fade-out"
    );


    setTimeout(
        function() {

            namePage.classList.add(
                "hidden"
            );


            namePage.classList.remove(
                "fade-out"
            );


            quizPage.classList.remove(
                "hidden"
            );


            quizPage.classList.add(
                "fade-in"
            );


            /*
               Sekarang baru ambil
               pertanyaan dari API.
            */

            loadQuestions();

        },
        350
    );
}


/* ==================================================
   LOAD QUESTIONS
================================================== */

async function loadQuestions() {

    kanji.textContent =
        "Memuat soal...";


    loadingMessage.classList.remove(
        "hidden"
    );


    instruction.classList.add(
        "hidden"
    );


    options.innerHTML =
        "";


    answerButton.disabled =
        true;


    progressText.textContent =
        "Menghubungkan...";


    try {

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "API error HTTP " +
                response.status
            );
        }


        const data =
            await response.json();


        console.log(
            "DATA API:",
            data
        );


        if (!data.success) {

            throw new Error(
                data.error ||
                "API mengembalikan error."
            );
        }


        questions =
            Array.isArray(
                data.questions
            )
                ? data.questions
                : [];


        if (
            questions.length === 0
        ) {

            throw new Error(
                "Questions kosong."
            );
        }


        /*
           Reset semua data quiz.
        */

        completedQuestions =
            new Set();

        latestResults =
            {};

        retryQueue =
            [];

        retryCounters =
            {};

        attemptNumber =
            0;


        /*
           Acak pertanyaan.
        */

        shuffle(
            questions
        );


        loadingMessage.classList.add(
            "hidden"
        );


        instruction.classList.remove(
            "hidden"
        );


        /*
           Mulai soal pertama.
        */

        showNextQuestion();


    } catch (error) {

        console.error(
            "LOAD QUESTIONS ERROR:",
            error
        );


        loadingMessage.classList.add(
            "hidden"
        );


        kanji.textContent =
            "Gagal memuat soal";


        options.innerHTML = `

            <div class="option">

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;


        retryInfo.textContent =
            "Periksa koneksi atau API, lalu refresh halaman.";


        progressText.textContent =
            "ERROR";


        masteryText.textContent =
            "—";
    }
}


/* ==================================================
   NEXT QUESTION
================================================== */

function showNextQuestion() {

    /*
       Kalau semua soal sudah 2/2,
       quiz selesai.
    */

    if (
        completedQuestions.size ===
        questions.length
    ) {

        finishQuiz();

        return;
    }


    let nextQuestion =
        null;


    /*
       Cek soal retry yang sudah
       menunggu 5 soal lain.
    */

    for (
        let i = 0;
        i < retryQueue.length;
        i++
    ) {

        const retry =
            retryQueue[i];


        const count =
            retryCounters[
                retry.id
            ] || 0;


        if (
            count >= 5
        ) {

            nextQuestion =
                questions.find(
                    question =>
                        String(
                            question.id
                        ) ===
                        String(
                            retry.id
                        )
                );


            retryQueue.splice(
                i,
                1
            );


            delete retryCounters[
                retry.id
            ];


            break;
        }
    }


    /*
       Kalau belum ada retry,
       ambil soal baru.
    */

    if (
        !nextQuestion
    ) {

        nextQuestion =
            questions.find(
                question =>
                    !latestResults[
                        question.id
                    ]
            );
    }


    /*
       Kalau semua soal baru sudah
       pernah dicoba tetapi masih
       ada retry, ambil retry
       terdekat.
    */

    if (
        !nextQuestion &&
        retryQueue.length > 0
    ) {

        retryQueue.sort(
            function(a, b) {

                const aCount =
                    retryCounters[
                        a.id
                    ] || 0;

                const bCount =
                    retryCounters[
                        b.id
                    ] || 0;

                return (
                    (5 - aCount) -
                    (5 - bCount)
                );
            }
        );


        const retry =
            retryQueue.shift();


        nextQuestion =
            questions.find(
                question =>
                    String(
                        question.id
                    ) ===
                    String(
                        retry.id
                    )
            );


        delete retryCounters[
            retry.id
        ];
    }


    /*
       Pengaman.
    */

    if (
        !nextQuestion
    ) {

        finishQuiz();

        return;
    }


    currentQuestion =
        nextQuestion;


    attemptNumber++;


    /*
       Soal retry yang sedang
       menunggu dihitung sebagai
       "soal lain" hanya kalau
       bukan soal yang sedang
       ditampilkan.
    */

    retryQueue.forEach(
        retry => {

            if (
                String(
                    retry.id
                ) !==
                String(
                    currentQuestion.id
                )
            ) {

                retryCounters[
                    retry.id
                ] =
                    (
                        retryCounters[
                            retry.id
                        ] || 0
                    ) + 1;
            }
        }
    );


    showQuestion(
        currentQuestion
    );
}


/* ==================================================
   SHOW QUESTION
================================================== */

function showQuestion(
    question
) {

    selectedOptions =
        [];


    result.textContent =
        "";


    retryInfo.textContent =
        "";


    answerButton.disabled =
        true;


    progressText.textContent =
        "Percobaan " +
        attemptNumber;


    masteryText.textContent =
        completedQuestions.size +
        " / " +
        questions.length;


    kanji.textContent =
        question.kanji;


    createOptions(
        question
    );
}


/* ==================================================
   CREATE ANSWERS
================================================== */

function createOptions(
    question
) {

    options.innerHTML =
        "";


    /*
       Cari soal lain untuk
       membuat jawaban salah.
    */

    const others =
        questions.filter(
            item =>
                String(
                    item.id
                ) !==
                String(
                    question.id
                )
        );


    shuffle(
        others
    );


    const wrongHiragana =
        others[0]
            ? others[0].hiragana
            : "よむ";


    const wrongIndonesia =
        others[1]
            ? others[1].indonesia
            : "membaca";


    /*
       Dua jawaban benar:
       - Hiragana
       - Indonesia

       Dua jawaban salah:
       - Hiragana soal lain
       - Indonesia soal lain
    */

    const answerList = [

        {
            value:
                question.hiragana,

            correct:
                true
        },

        {
            value:
                question.indonesia,

            correct:
                true
        },

        {
            value:
                wrongHiragana,

            correct:
                false
        },

        {
            value:
                wrongIndonesia,

            correct:
                false
        }

    ];


    shuffle(
        answerList
    );


    answerList.forEach(
        function(
            item,
            index
        ) {

            const element =
                document.createElement(
                    "div"
                );


            element.className =
                "option";


            element.dataset.index =
                index;


            element.dataset.correct =
                item.correct
                    ? "true"
                    : "false";


            element.textContent =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                item.value;


            element.addEventListener(
                "click",
                function() {

                    toggleOption(
                        element
                    );

                }
            );


            options.appendChild(
                element
            );
        }
    );
}


/* ==================================================
   PILIH JAWABAN
================================================== */

function toggleOption(
    element
) {

    const index =
        Number(
            element.dataset.index
        );


    /*
       Kalau sudah dipilih,
       batalkan.
    */

    if (
        selectedOptions.includes(
            index
        )
    ) {

        selectedOptions =
            selectedOptions.filter(
                selectedIndex =>
                    selectedIndex !==
                    index
            );


        element.classList.remove(
            "selected"
        );


    } else {

        /*
           Maksimal dua pilihan.
        */

        if (
            selectedOptions.length >= 2
        ) {

            return;
        }


        selectedOptions.push(
            index
        );


        element.classList.add(
            "selected"
        );
    }


    answerButton.disabled =
        selectedOptions.length === 0;
}


/* ==================================================
   TOMBOL JAWAB
================================================== */

answerButton.addEventListener(
    "click",
    checkAnswer
);


/* ==================================================
   CHECK ANSWER
================================================== */

function checkAnswer() {

    if (
        selectedOptions.length === 0
    ) {

        return;
    }


    const optionElements =
        document.querySelectorAll(
            ".option"
        );


    let correctCount =
        0;


    const selectedData =
        [];


    selectedOptions.forEach(
        function(index) {

            const element =
                optionElements[
                    index
                ];


            const isCorrect =
                element.dataset.correct ===
                "true";


            if (
                isCorrect
            ) {

                correctCount++;
            }


            selectedData.push({

                answer:
                    element.textContent,

                correct:
                    isCorrect

            });

        }
    );


    let category;


    if (
        correctCount === 2
    ) {

        category =
            "benar";


        result.textContent =
            "2/2 BENAR";


    } else if (
        correctCount === 1
    ) {

        category =
            "sebagian";


        result.textContent =
            "1/2 BENAR";


    } else {

        category =
            "salah";


        result.textContent =
            "0/2 SALAH";
    }


    /*
       Simpan hasil terakhir
       pertanyaan ini.
    */

    latestResults[
        currentQuestion.id
    ] = {

        id:
            currentQuestion.id,

        kanji:
            currentQuestion.kanji,

        hiragana:
            currentQuestion.hiragana,

        indonesia:
            currentQuestion.indonesia,

        score:
            correctCount,

        category:
            category,

        selected:
            selectedData

    };


    /*
       Tampilkan jawaban benar
       dan jawaban salah user.
    */

    optionElements.forEach(
        function(element) {

            const isCorrect =
                element.dataset.correct ===
                "true";


            const wasSelected =
                selectedOptions.includes(
                    Number(
                        element.dataset.index
                    )
                );


            if (
                isCorrect
            ) {

                element.classList.add(
                    "correct"
                );


            } else if (
                wasSelected
            ) {

                element.classList.add(
                    "wrong"
                );
            }


            element.style.pointerEvents =
                "none";
        }
    );


    answerButton.disabled =
        true;


    /*
       2/2 = selesai.
    */

    if (
        correctCount === 2
    ) {

        completedQuestions.add(
            currentQuestion.id
        );


        retryQueue =
            retryQueue.filter(
                retry =>
                    String(
                        retry.id
                    ) !==
                    String(
                        currentQuestion.id
                    )
            );


        delete retryCounters[
            currentQuestion.id
        ];


        retryInfo.textContent =
            "✓ Soal selesai.";


    } else {

        /*
           1/2 atau 0/2.
           Masukkan ke retry queue.
        */

        const alreadyQueued =
            retryQueue.some(
                retry =>
                    String(
                        retry.id
                    ) ===
                    String(
                        currentQuestion.id
                    )
            );


        if (
            !alreadyQueued
        ) {

            retryQueue.push({

                id:
                    currentQuestion.id

            });


            retryCounters[
                currentQuestion.id
            ] = 0;
        }


        retryInfo.textContent =
            "Soal akan diulang setelah 5 soal lain.";
    }


    /*
       Beri waktu melihat
       hasil sebelum lanjut.
    */

    setTimeout(
        function() {

            showNextQuestion();

        },
        900
    );
}


/* ==================================================
   FINISH QUIZ
================================================== */

async function finishQuiz() {

    quizPage.classList.add(
        "fade-out"
    );


    setTimeout(
        async function() {

            quizPage.classList.add(
                "hidden"
            );


            quizPage.classList.remove(
                "fade-out"
            );


            resultPage.classList.remove(
                "hidden"
            );


            resultPage.classList.add(
                "fade-in"
            );


            /*
               Ambil hasil terakhir
               setiap pertanyaan.
            */

            const allResults =
                questions
                    .map(
                        question =>
                            latestResults[
                                question.id
                            ]
                    )
                    .filter(
                        item =>
                            item
                    );


            const total =
                questions.length;


            const correct =
                allResults.filter(
                    item =>
                        item.category ===
                        "benar"
                ).length;


            const partial =
                allResults.filter(
                    item =>
                        item.category ===
                        "sebagian"
                ).length;


            const wrong =
                allResults.filter(
                    item =>
                        item.category ===
                        "salah"
                ).length;


            resultName.textContent =
                playerName;


            totalResult.textContent =
                total;


            correctResult.textContent =
                correct;


            partialResult.textContent =
                partial;


            wrongResult.textContent =
                wrong;


            /*
               Kirim ke Sheet1.
            */

            await sendResults(
                total,
                correct,
                partial,
                wrong,
                allResults
            );

        },
        350
    );
}


/* ==================================================
   SEND RESULT KE GOOGLE SHEETS
================================================== */

async function sendResults(
    total,
    correct,
    partial,
    wrong,
    allResults
) {

    saveStatus.textContent =
        "Mengirim hasil ke admin...";


    const payload = {

        nama:
            playerName,

        total:
            total,

        benar:
            correct,

        sebagian:
            partial,

        salah:
            wrong,

        detail:
            allResults

    };


    try {

        await fetch(
            API_URL,
            {

                method:
                    "POST",

                mode:
                    "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body:
                    JSON.stringify(
                        payload
                    )

            }
        );


        saveStatus.textContent =
            "✓ Hasil sudah dikirim ke admin.";


    } catch (
        error
    ) {

        console.error(
            "POST ERROR:",
            error
        );


        saveStatus.textContent =
            "Gagal mengirim hasil.";
    }
}


/* ==================================================
   REVIEW
================================================== */

reviewButton.addEventListener(
    "click",
    showReview
);


function showReview() {

    resultPage.classList.add(
        "hidden"
    );


    reviewPage.classList.remove(
        "hidden"
    );


    reviewList.innerHTML =
        "";


    questions.forEach(
        function(question) {

            const item =
                latestResults[
                    question.id
                ];


            if (
                !item
            ) {

                return;
            }


            let symbol =
                "×";


            if (
                item.category ===
                "benar"
            ) {

                symbol =
                    "✓";


            } else if (
                item.category ===
                "sebagian"
            ) {

                symbol =
                    "△";
            }


            const selectedAnswers =
                item.selected
                    .map(
                        selected =>
                            escapeHTML(
                                selected.answer
                            )
                    )
                    .join(
                        "<br>"
                    );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "review-item";


            div.innerHTML = `

                <div class="review-kanji">
                    ${escapeHTML(
                        item.kanji
                    )}
                </div>

                <div>
                    ${escapeHTML(
                        item.hiragana
                    )}
                    —
                    ${escapeHTML(
                        item.indonesia
                    )}
                </div>

                <div class="review-status">
                    ${symbol}
                    ${item.score}/2
                </div>

                <div class="small">

                    Jawaban kamu:

                    <br>

                    ${
                        selectedAnswers ||
                        "Tidak ada"
                    }

                </div>

            `;


            reviewList.appendChild(
                div
            );

        }
    );
}

/* ==================================================
   SHUFFLE
================================================== */

function shuffle(
    array
) {

    for (
        let i =
            array.length - 1;

        i > 0;

        i--
    ) {

        const j =
            Math.floor(
                Math.random() *
                (i + 1)
            );


        const temp =
            array[i];


        array[i] =
            array[j];


        array[j] =
            temp;
    }


    return array;
}


/* ==================================================
   ESCAPE HTML
================================================== */

function escapeHTML(
    value
) {

    return String(
        value
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );
}
