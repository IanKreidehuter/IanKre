<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Bahasa Jepang N5</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f4f4;
    color: #171717;
}

.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.card {
    width: 100%;
    max-width: 560px;
    background: #fff;
    border-radius: 22px;
    padding: 28px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
}

.hidden {
    display: none !important;
}

.fade-in {
    animation: fadeIn 0.4s ease;
}

.fade-out {
    animation: fadeOut 0.35s ease forwards;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@keyframes fadeOut {
    from {
        opacity: 1;
    }

    to {
        opacity: 0;
    }
}

h1 {
    text-align: center;
    margin-top: 0;
}

.subtitle {
    text-align: center;
    color: #777;
}

input {
    width: 100%;
    padding: 15px;
    margin-top: 20px;
    border: 1px solid #ccc;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

input:focus {
    border-color: #171717;
}

button {
    width: 100%;
    padding: 15px;
    margin-top: 15px;
    border: none;
    border-radius: 12px;
    background: #171717;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.progress {
    display: flex;
    justify-content: space-between;
    color: #777;
    font-size: 14px;
}

.kanji {
    text-align: center;
    font-size: 64px;
    margin: 35px 0;
}

.instruction {
    text-align: center;
    color: #777;
    margin-bottom: 18px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    padding: 17px;
    border: 2px solid #ddd;
    border-radius: 14px;
    cursor: pointer;
    background: white;
    transition: 0.15s;
}

.option.selected {
    border-color: #171717;
    background: #f0f0f0;
}

.option.correct {
    border-color: #222;
    background: #e8f5e9;
}

.option.wrong {
    border-color: #777;
    background: #f5f5f5;
}

.result {
    text-align: center;
    font-size: 24px;
    font-weight: bold;
    margin: 20px 0;
    min-height: 30px;
}

.retry-info {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin-top: 10px;
}

.stats {
    text-align: center;
    margin: 25px 0;
}

.stat {
    margin: 12px 0;
    font-size: 18px;
}

.review-item {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 16px;
    margin-top: 12px;
}

.review-kanji {
    font-size: 28px;
    font-weight: bold;
}

.review-status {
    margin-top: 8px;
    font-weight: bold;
}

.small {
    text-align: center;
    color: #777;
    font-size: 14px;
}

.error {
    color: #b00020;
    text-align: center;
    margin-top: 12px;
}
</style>
</head>

<body>

<!-- ================================
     NAMA
================================ -->

<section id="namePage" class="page">

    <div class="card">

        <h1>Japanese Quiz</h1>

        <p class="subtitle">
            Masukkan nama untuk memulai
        </p>

        <input
            id="nameInput"
            type="text"
            placeholder="Nama kamu"
            autocomplete="name"
        >

        <button id="startButton">
            MULAI
        </button>

        <p id="nameError" class="error"></p>

    </div>

</section>


<!-- ================================
     QUIZ
================================ -->

<section id="quizPage" class="page hidden">

    <div class="card">

        <div class="progress">

            <span id="progressText">
                Soal 1 / 10
            </span>

            <span id="masteryText">
                0 / 10
            </span>

        </div>


        <div
            id="kanji"
            class="kanji">
        </div>


        <div class="instruction">
            Pilih maksimal 2 jawaban
        </div>


        <div
            id="options"
            class="options">
        </div>


        <button
            id="answerButton"
            disabled>
            JAWAB
        </button>


        <div
            id="result"
            class="result">
        </div>


        <div
            id="retryInfo"
            class="retry-info">
        </div>

    </div>

</section>


<!-- ================================
     HASIL
================================ -->

<section id="resultPage" class="page hidden">

    <div class="card">

        <h1>Quiz Selesai</h1>

        <p
            id="resultName"
            class="subtitle">
        </p>


        <div class="stats">

            <div class="stat">
                <strong id="totalResult">0</strong>
                Pertanyaan
            </div>

            <div class="stat">
                ✓
                <strong id="correctResult">0</strong>
                Benar
            </div>

            <div class="stat">
                ✓
                <strong id="partialResult">0</strong>
                Sebagian benar
            </div>

            <div class="stat">
                ×
                <strong id="wrongResult">0</strong>
                Salah
            </div>

        </div>


        <p
            id="saveStatus"
            class="small">
            Menyimpan hasil...
        </p>


        <button id="reviewButton">
            LIHAT REVIEW
        </button>

    </div>

</section>


<!-- ================================
     REVIEW
================================ -->

<section id="reviewPage" class="page hidden">

    <div class="card">

        <h1>Review</h1>

        <div id="reviewList"></div>

        <button id="backResultButton">
            KEMBALI KE HASIL
        </button>

    </div>

</section>


<script>

/* =================================
   API
================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbzwwzXuR4RyVsYotVtvrj8azxZyfmNyIwxngTkH6SEAJl7P8_Y4HKKHRFuPLT4JMSWCTQ/exec";


/* =================================
   STATE
================================= */

let playerName = "";

let questions = [];

let currentQuestion = null;

let currentQuestionIndex = 0;

let selectedOptions = [];

let attemptNumber = 0;


/*
    ID soal yang sudah mendapat 2/2.
*/
let completedQuestions = new Set();


/*
    Hasil terakhir setiap soal.
*/
let latestResults = {};


/*
    Soal yang harus diulang.

    Contoh:

    {
        id: "3",
        remaining: 5
    }
*/
let retryQueue = [];


/*
    Jumlah percobaan sejak soal
    tertentu terakhir dijawab.
*/
let retryCounters = {};


/* =================================
   ELEMENTS
================================= */

const namePage =
document.getElementById("namePage");

const quizPage =
document.getElementById("quizPage");

const resultPage =
document.getElementById("resultPage");

const reviewPage =
document.getElementById("reviewPage");

const nameInput =
document.getElementById("nameInput");

const startButton =
document.getElementById("startButton");

const nameError =
document.getElementById("nameError");

const progressText =
document.getElementById("progressText");

const masteryText =
document.getElementById("masteryText");

const kanji =
document.getElementById("kanji");

const options =
document.getElementById("options");

const answerButton =
document.getElementById("answerButton");

const result =
document.getElementById("result");

const retryInfo =
document.getElementById("retryInfo");

const resultName =
document.getElementById("resultName");

const totalResult =
document.getElementById("totalResult");

const correctResult =
document.getElementById("correctResult");

const partialResult =
document.getElementById("partialResult");

const wrongResult =
document.getElementById("wrongResult");

const saveStatus =
document.getElementById("saveStatus");

const reviewButton =
document.getElementById("reviewButton");

const reviewList =
document.getElementById("reviewList");

const backResultButton =
document.getElementById("backResultButton");


/* =================================
   START
================================= */

startButton.addEventListener(
    "click",
    startQuiz
);


async function startQuiz() {

    playerName =
        nameInput.value.trim();


    if (!playerName) {

        nameError.textContent =
            "Masukkan nama terlebih dahulu.";

        return;
    }


    nameError.textContent = "";


    startButton.disabled = true;

    startButton.textContent =
        "MEMUAT...";


    try {

        const response =
            await fetch(API_URL);


        if (!response.ok) {

            throw new Error(
                "API tidak dapat diakses."
            );
        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Gagal mengambil soal."
            );
        }


        questions =
            Array.isArray(data.questions)
                ? data.questions
                : [];


        if (
            questions.length === 0
        ) {

            throw new Error(
                "Questions kosong."
            );
        }


        /*
            Reset quiz.
        */

        completedQuestions =
            new Set();

        latestResults = {};

        retryQueue = [];

        retryCounters = {};

        attemptNumber = 0;

        currentQuestionIndex = 0;


        /*
            Acak soal awal.
        */

        shuffle(questions);


        /*
            Fade halaman nama.
        */

        namePage.classList.add(
            "fade-out"
        );


        setTimeout(
            () => {

                namePage.classList.add(
                    "hidden"
                );

                namePage.classList.remove(
                    "fade-out"
                );


                quizPage.classList.remove(
                    "hidden"
                );

                quizPage.classList.add(
                    "fade-in"
                );


                showNextQuestion();

            },
            350
        );


    } catch (error) {

        console.error(error);


        nameError.textContent =
            error.message;


        startButton.disabled =
            false;


        startButton.textContent =
            "MULAI";
    }
}


/* =================================
   NEXT QUESTION
================================= */

function showNextQuestion() {

    /*
        Kalau semua soal sudah
        mendapat 2/2, selesai.
    */

    if (
        completedQuestions.size ===
        questions.length
    ) {

        finishQuiz();

        return;
    }


    let nextQuestion = null;


    /*
        1.
        Cari retry yang sudah
        menunggu 5 soal lain.
    */

    for (
        let i = 0;
        i < retryQueue.length;
        i++
    ) {

        const retry =
            retryQueue[i];


        if (
            retryCounters[retry.id] >= 5
        ) {

            nextQuestion =
                questions.find(
                    question =>
                        String(question.id) ===
                        String(retry.id)
                );


            retryQueue.splice(i, 1);


            delete retryCounters[
                retry.id
            ];


            break;
        }
    }


    /*
        2.
        Kalau tidak ada retry,
        cari soal baru.
    */

    if (!nextQuestion) {

        nextQuestion =
            questions.find(
                question =>
                    !latestResults[
                        question.id
                    ]
            );
    }


    /*
        3.
        Kalau semua soal baru sudah
        pernah dicoba tetapi retry
        masih menunggu, kerjakan
        soal dengan retry terdekat.
    */

    if (!nextQuestion) {

        if (
            retryQueue.length > 0
        ) {

            retryQueue.sort(
                (
                    a,
                    b
                ) =>
                    (
                        5 -
                        retryCounters[a.id]
                    ) -
                    (
                        5 -
                        retryCounters[b.id]
                    )
            );


            const retry =
                retryQueue.shift();


            nextQuestion =
                questions.find(
                    question =>
                        String(question.id) ===
                        String(retry.id)
                );


            delete retryCounters[
                retry.id
            ];
        }
    }


    /*
        Pengaman.
    */

    if (!nextQuestion) {

        finishQuiz();

        return;
    }


    currentQuestion =
        nextQuestion;


    attemptNumber++;


    /*
        Setiap soal yang bukan
        soal sekarang menunggu
        satu langkah lebih dekat
        ke retry.
    */

    updateRetryCounters();


    showQuestion(
        currentQuestion
    );
}


/* =================================
   SHOW QUESTION
================================= */

function showQuestion(question) {

    currentQuestion =
        question;


    selectedOptions = [];


    result.textContent = "";


    retryInfo.textContent = "";


    answerButton.disabled =
        true;


    progressText.textContent =
        "Percobaan " +
        attemptNumber;


    masteryText.textContent =
        completedQuestions.size +
        " / " +
        questions.length;


    kanji.textContent =
        question.kanji;


    createOptions(
        question
    );
}


/* =================================
   CREATE OPTIONS
================================= */

function createOptions(question) {

    options.innerHTML = "";


    /*
        Soal lain digunakan untuk
        membuat distractor.
    */

    const others =
        questions.filter(
            questionItem =>
                String(questionItem.id) !==
                String(question.id)
        );


    shuffle(others);


    const wrongHiragana =
        others[0]
            ? others[0].hiragana
            : "よむ";


    const wrongIndonesia =
        others[1]
            ? others[1].indonesia
            : "membaca";


    /*
        Dua benar:
        1. Hiragana
        2. Indonesia

        Dua salah:
        3. Hiragana soal lain
        4. Indonesia soal lain
    */

    const answerList = [

        {
            value:
                question.hiragana,

            correct:
                true
        },

        {
            value:
                question.indonesia,

            correct:
                true
        },

        {
            value:
                wrongHiragana,

            correct:
                false
        },

        {
            value:
                wrongIndonesia,

            correct:
                false
        }

    ];


    shuffle(answerList);


    answerList.forEach(
        (
            item,
            index
        ) => {

            const option =
                document.createElement(
                    "div"
                );


            option.className =
                "option";


            option.dataset.index =
                index;


            option.dataset.correct =
                item.correct
                    ? "true"
                    : "false";


            option.textContent =
                String.fromCharCode(
                    65 + index
                ) +
                ". " +
                item.value;


            option.addEventListener(
                "click",
                () =>
                    toggleOption(
                        option
                    )
            );


            options.appendChild(
                option
            );
        }
    );
}


/* =================================
   SELECT OPTION
================================= */

function toggleOption(option) {

    const index =
        Number(
            option.dataset.index
        );


    /*
        Kalau sudah dipilih,
        batalkan pilihan.
    */

    if (
        selectedOptions.includes(
            index
        )
    ) {

        selectedOptions =
            selectedOptions.filter(
                selectedIndex =>
                    selectedIndex !==
                    index
            );


        option.classList.remove(
            "selected"
        );


    } else {

        /*
            Maksimal 2 pilihan.
        */

        if (
            selectedOptions.length >= 2
        ) {

            return;
        }


        selectedOptions.push(
            index
        );


        option.classList.add(
            "selected"
        );
    }


    answerButton.disabled =
        selectedOptions.length === 0;
}


/* =================================
   ANSWER BUTTON
================================= */

answerButton.addEventListener(
    "click",
    checkAnswer
);


function checkAnswer() {

    if (
        selectedOptions.length === 0
    ) {

        return;
    }


    const optionElements =
        document.querySelectorAll(
            ".option"
        );


    let correctCount = 0;


    const selectedData = [];


    selectedOptions.forEach(
        index => {

            const option =
                optionElements[index];


            const correct =
                option.dataset.correct ===
                "true";


            if (correct) {

                correctCount++;
            }


            selectedData.push({

                answer:
                    option.textContent,

                correct:
                    correct
            });
        }
    );


    let category = "";


    if (
        correctCount === 2
    ) {

        category =
            "benar";


        result.textContent =
            "2/2 BENAR";


    } else if (
        correctCount === 1
    ) {

        category =
            "sebagian";


        result.textContent =
            "1/2 BENAR";


    } else {

        category =
            "salah";


        result.textContent =
            "0/2 SALAH";
    }


    /*
        Simpan hasil terakhir soal.
    */

    latestResults[
        currentQuestion.id
    ] = {

        id:
            currentQuestion.id,

        kanji:
            currentQuestion.kanji,

        hiragana:
            currentQuestion.hiragana,

        indonesia:
            currentQuestion.indonesia,

        score:
            correctCount,

        category:
            category,

        selected:
            selectedData
    };


    /*
        Tampilkan jawaban benar
        dan pilihan salah user.
    */

    optionElements.forEach(
        option => {

            const isCorrect =
                option.dataset.correct ===
                "true";


            const wasSelected =
                selectedOptions.includes(
                    Number(
                        option.dataset.index
                    )
                );


            if (isCorrect) {

                option.classList.add(
                    "correct"
                );

            } else if (
                wasSelected
            ) {

                option.classList.add(
                    "wrong"
                );
            }


            option.style.pointerEvents =
                "none";
        }
    );


    answerButton.disabled =
        true;


    /*
        Kalau 2/2:
        soal selesai.
    */

    if (
        correctCount === 2
    ) {

        completedQuestions.add(
            currentQuestion.id
        );


        /*
            Hapus soal ini dari
            antrean retry.
        */

        retryQueue =
            retryQueue.filter(
                retry =>
                    String(retry.id) !==
                    String(currentQuestion.id)
            );


        delete retryCounters[
            currentQuestion.id
        ];


        retryInfo.textContent =
            "Soal selesai. Tidak akan diulang.";

    }


    /*
        Kalau belum 2/2:
        masuk antrean retry.
    */

    else {

        /*
            Jangan masukkan duplicate
            retry untuk soal yang sama.
        */

        const alreadyQueued =
            retryQueue.some(
                retry =>
                    String(retry.id) ===
                    String(currentQuestion.id)
            );


        if (!alreadyQueued) {

            retryQueue.push({

                id:
                    currentQuestion.id
            });


            retryCounters[
                currentQuestion.id
            ] = 0;
        }


        retryInfo.textContent =
            "Belum 2/2. Akan diulang setelah 5 soal lain.";
    }


    /*
        Tunggu sebentar supaya
        user bisa melihat hasil.
    */

    setTimeout(
        showNextQuestion,
        900
    );
}


/* =================================
   RETRY COUNTERS
================================= */

function updateRetryCounters() {

    /*
        Kita menghitung setiap soal
        yang sudah dikerjakan.

        Soal yang sedang menunggu
        retry akan bertambah 1.

        Soal yang baru saja dikerjakan
        tidak dihitung sebagai soal lain.
    */

    retryQueue.forEach(
        retry => {

            if (
                String(retry.id) !==
                String(
                    currentQuestion.id
                )
            ) {

                retryCounters[
                    retry.id
                ] =
                    (
                        retryCounters[
                            retry.id
                        ] || 0
                    ) + 1;
            }
        }
    );
}


/* =================================
   FINISH
================================= */

async function finishQuiz() {

    quizPage.classList.add(
        "fade-out"
    );


    setTimeout(
        async () => {

            quizPage.classList.add(
                "hidden"
            );


            quizPage.classList.remove(
                "fade-out"
            );


            resultPage.classList.remove(
                "hidden"
            );


            resultPage.classList.add(
                "fade-in"
            );


            /*
                Ambil hasil terakhir
                dari setiap soal.
            */

            const allResults =
                questions.map(
                    question =>
                        latestResults[
                            question.id
                        ]
                ).filter(
                    resultItem =>
                        resultItem
                );


            const total =
                questions.length;


            const correct =
                allResults.filter(
                    resultItem =>
                        resultItem.category ===
                        "benar"
                ).length;


            const partial =
                allResults.filter(
                    resultItem =>
                        resultItem.category ===
                        "sebagian"
                ).length;


            const wrong =
                allResults.filter(
                    resultItem =>
                        resultItem.category ===
                        "salah"
                ).length;


            resultName.textContent =
                playerName;


            totalResult.textContent =
                total;


            correctResult.textContent =
                correct;


            partialResult.textContent =
                partial;


            wrongResult.textContent =
                wrong;


            await sendResults(
                total,
                correct,
                partial,
                wrong,
                allResults
            );

        },
        350
    );
}


/* =================================
   POST RESULT
================================= */

async function sendResults(
    total,
    correct,
    partial,
    wrong,
    allResults
) {

    saveStatus.textContent =
        "Mengirim hasil ke admin...";


    const payload = {

        nama:
            playerName,

        total:
            total,

        benar:
            correct,

        sebagian:
            partial,

        salah:
            wrong,

        detail:
            allResults
    };


    try {

        await fetch(
            API_URL,
            {

                method:
                    "POST",

                mode:
                    "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"
                },

                body:
                    JSON.stringify(
                        payload
                    )
            }
        );


        saveStatus.textContent =
            "
