<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Learning Archive — Adrian's Archive</title>
<meta name="theme-color" content="#060607">
<link rel="stylesheet" href="/style.css">
</head>
<body>

  <div class="backdrop">
    <img class="backdrop__img" src="/profile.jpg" alt="">
  </div>

  <main class="page">

    <header class="header">
      <div class="avatar">
        <img src="/logo.jpg" alt="The Learning Archive logo">
      </div>
      <div class="header__text">
        <h1 class="header__title">The Learning Archive</h1>
        <p class="header__subtitle">Adrian's Archive</p>
      </div>
      <div class="avatar avatar--right">
        <img src="/profile.jpg" alt="Adrian's profile photo">
      </div>
    </header>

    <section class="folder-grid" aria-label="Archive sections">
      <div class="folder-card" data-nav="/kanji/">
        <span class="folder-card__glyph">漢字</span>
        <span class="folder-card__label">Kanji</span>
      </div>
      <div class="folder-card" data-nav="/kotoba/">
        <span class="folder-card__glyph">語彙</span>
        <span class="folder-card__label">Kotoba</span>
      </div>
      <div class="folder-card" data-nav="/kyozai/">
        <span class="folder-card__glyph">教材</span>
        <span class="folder-card__label">Kyōzai</span>
      </div>
      <div class="folder-card" data-nav="/quizs/">
        <span class="folder-card__glyph">QUIZS</span>
        <span class="folder-card__label">Practice &amp; scores</span>
      </div>
    </section>

  </main>

  <nav class="dock" aria-label="Primary">
    <a class="dock__item dock__item--active" href="/">
      <img src="/logo.jpg" alt="">
      <span class="dock__label">Home</span>
    </a>
    <a class="dock__item" href="/profile/">
      <span class="dock__star">★</span>
      <span class="dock__label">Profile</span>
    </a>
  </nav>

  <script src="/app.js"></script>
</body>
</html>
